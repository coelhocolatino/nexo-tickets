<!DOCTYPE html>
<!-- Nexo Tickets — asignar.html (Pedidos asignados)
     v3.10.1 (2026-10-09, ronda 24): diseño nuevo (nexo-tema.css), cabecera
     con logo y usuario, tarjetas como las de Embolsado (nº de ticket grande,
     caja debajo), botones Incidencia / Entregar, y comprobación de versión
     al entrar (nexo-version.js + version.json). La lógica no cambia. -->
<html lang="es" data-pagina="asignar" data-version="v3.10.1">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FEFEFE" />
<title>Nexo · Pedidos asignados</title>
<link rel="icon" href="nexo-icon-192.png">
<link rel="stylesheet" href="nexo-tema.css?v=24">
<script src="nexo-version.js?v=1"></script>
<script>
/* Guard de sesión */
(function () {
  try {
    var u = JSON.parse(sessionStorage.getItem('sad_user') || 'null');
    if (!u || !u.usuario || !u.token) location.replace('login.html');
  } catch (e) { location.replace('login.html'); }
})();
</script>
<style>
/* Ronda 24 (2026-10-09): diseño nuevo. Se mantienen las clases que pinta el
   script (card, cab, fila, chips, acciones, tk, lote, modal…). */
body.nx { padding-bottom:96px; }
.top-tit { display:flex; align-items:flex-end; justify-content:space-between; gap:8px; }
.info { font-size:13px; font-weight:700; color:var(--nx-suave); }
#msg { display:none; padding:10px 12px; border-radius:12px; font-size:14px; font-weight:700; line-height:1.4; }
#msg.ok { display:block; background:var(--nx-verde-fondo); color:var(--nx-verde-tinta); }
#msg.err { display:block; background:var(--nx-rojo-fondo); color:#7A1A12; }
.vacio { text-align:center; color:var(--nx-suave); font-weight:700; padding:32px 12px; background:var(--nx-superficie); border-radius:var(--nx-r-tarjeta); }
#lista { display:flex; flex-direction:column; gap:12px; }

/* Tarjeta de pedido */
.card { position:relative; background:var(--nx-superficie); color:var(--nx-tinta); border-radius:var(--nx-r-tarjeta); padding:16px;
  display:flex; flex-direction:column; gap:12px; }
.card.cobro { background:var(--nx-cobro); }
.card .sup { display:grid; grid-template-columns:92px minmax(0,1fr); gap:12px; }
.card .num-box { background:var(--nx-tinta); border-radius:10px; min-height:96px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:4px; padding:8px 4px; text-align:center; }
.card .num-box .n { font-family:var(--nx-display); font-weight:800; font-size:38px; line-height:1; color:var(--nx-tinta-clara); white-space:nowrap; letter-spacing:-.01em; }
.card .num-box .n.largo { font-size:27px; }
.card .num-box .s { font-size:12px; font-weight:700; color:#B9C7DD; }
.card .der { display:flex; flex-direction:column; gap:6px; min-width:0; }
.card .cab { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.card .cab .chk { width:26px; height:26px; accent-color:var(--nx-tinta); flex:0 0 auto; margin:0; }
.card .cliente { font-size:18px; font-weight:800; line-height:1.15; overflow-wrap:anywhere; }
.tag { display:inline-flex; align-items:center; background:var(--nx-chip); color:var(--nx-tinta); border-radius:6px; padding:3px 8px; font-size:12px; font-weight:800; }
.card.cobro .tag, .card.cobro .chip { background:rgba(255,255,255,.65); }
.fila { font-size:15px; font-weight:600; }
.fila b { display:block; color:var(--nx-suave); font-weight:700; font-size:12px; margin-bottom:2px; }
.fila a.tel { display:inline-flex; align-items:center; gap:6px; min-height:36px; color:var(--nx-azul); font-weight:800; font-size:16px; text-decoration:none; }
.fila textarea { width:100%; min-height:48px; border:1.5px solid var(--nx-linea); border-radius:10px; padding:8px 10px; resize:vertical;
  background:var(--nx-campo); color:var(--nx-tinta); font:600 16px/1.35 var(--nx-texto); }
.card.cobro .fila textarea { background:rgba(255,255,255,.65); }
.chips { display:flex; flex-wrap:wrap; gap:6px; }
.chip { background:var(--nx-chip); border-radius:6px; padding:4px 8px; font-size:12px; font-weight:800; }
.cobro-badge { align-self:flex-start; background:var(--nx-tinta); color:#FFF1A6; border-radius:8px; padding:6px 10px; font-size:14px; font-weight:800; }
.acciones { display:grid; grid-template-columns:52px minmax(0,1fr) minmax(0,1.25fr); gap:8px; }
.acciones button, .acciones a { min-height:52px; border:0; border-radius:12px; font:800 15px var(--nx-texto); text-decoration:none;
  display:flex; align-items:center; justify-content:center; gap:6px; cursor:pointer; }
.b-inc { background:transparent; box-shadow:inset 0 0 0 1.5px var(--nx-rojo); color:var(--nx-rojo); }
.b-ent { background:var(--nx-verde); color:#fff; }
.btn-cam { width:52px; background:var(--nx-azul-fondo); color:var(--nx-azul); }
.acciones.hecho { grid-template-columns:52px minmax(0,1fr); }
.b-hecho { background:var(--nx-chip); color:var(--nx-suave); cursor:default; }
.b-deshacer { min-height:48px; border:0; border-radius:12px; background:transparent; box-shadow:inset 0 0 0 1.5px var(--nx-linea);
  color:var(--nx-tinta); font:800 15px var(--nx-texto); cursor:pointer; }
.tag.rep { background:var(--nx-tinta); color:var(--nx-tinta-clara); }
/* Bloque "Entregados hoy (n)", cerrado hasta que se toca */
details.entregados { background:var(--nx-chip); border-radius:var(--nx-r-tarjeta); }
details.entregados > summary { list-style:none; display:flex; align-items:center; justify-content:space-between; gap:8px;
  min-height:56px; padding:0 16px; font-weight:800; font-size:16px; color:var(--nx-tinta); cursor:pointer; }
details.entregados > summary::-webkit-details-marker { display:none; }
details.entregados > summary .flecha { transition:transform .15s; color:var(--nx-suave); }
details.entregados[open] > summary .flecha { transform:rotate(180deg); }
.ent-lista { display:flex; flex-direction:column; gap:12px; padding:0 8px 8px; }
.ent-lista .card { opacity:.92; }
.btn-cam:disabled { opacity:.4; }
.acciones.solo-cam { grid-template-columns:52px; justify-content:end; }
/* %DIA */
.card.dia .num-box { background:#7A1A4A; }
.card.dia.alerta { box-shadow:0 0 0 3px var(--nx-lampara); }
.card.dia.tarde { box-shadow:0 0 0 3px var(--nx-rojo); }
.dia-aviso { border-radius:12px; padding:10px 12px; font-size:13px; font-weight:800; background:var(--nx-ambar-fondo); color:var(--nx-ambar-tinta); }
.card.dia.tarde .dia-aviso { background:var(--nx-rojo-fondo); color:#7A1A12; }

/* Barra de asignar */
.barra { position:fixed; left:0; right:0; bottom:0; z-index:40; padding:24px 16px calc(16px + env(safe-area-inset-bottom));
  background:linear-gradient(to top, var(--nx-fondo) 65%, rgba(232,237,243,0)); display:none; }
.barra button { width:100%; max-width:528px; display:flex; align-items:center; justify-content:center; margin:0 auto; min-height:56px; border:0;
  border-radius:16px; background:var(--nx-tinta); color:var(--nx-tinta-clara); font:800 17px var(--nx-texto); cursor:pointer; }
.barra button:disabled { background:var(--nx-chip); color:var(--nx-suave); }

/* Hojas (modales) */
.modal { position:fixed; inset:0; z-index:200; background:rgba(11,36,71,.62); display:none; align-items:flex-end; justify-content:center; }
.modal.on { display:flex; }
.modal .box { width:100%; max-width:560px; max-height:92vh; overflow:auto; background:var(--nx-superficie); color:var(--nx-tinta);
  border-radius:24px 24px 0 0; padding:12px 20px calc(24px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:12px; }
.modal .box::before { content:''; align-self:center; width:40px; height:5px; border-radius:99px; background:var(--nx-linea); }
.modal h2 { margin:0; font-family:var(--nx-display); font-weight:800; font-size:30px; line-height:1.05; }
.modal img.foto { width:100%; border-radius:12px; }
.tipo { display:block; width:100%; min-height:48px; text-align:left; padding:0 14px; border:1.5px solid var(--nx-linea); border-radius:12px;
  background:var(--nx-campo); color:var(--nx-tinta); margin:0; font:700 16px var(--nx-texto); cursor:pointer; }
.tipo.on { border:2px solid var(--nx-tinta); background:var(--nx-superficie); font-weight:800; }
#incTipos { display:flex; flex-direction:column; gap:8px; }
.box textarea { width:100%; min-height:72px; border:1.5px solid var(--nx-linea); border-radius:12px; padding:10px 12px; background:var(--nx-campo);
  color:var(--nx-tinta); font:600 16px/1.35 var(--nx-texto); }
.box .row { display:flex; gap:8px; }
.box .row button { flex:1; min-height:56px; border:0; border-radius:14px; font:800 16px var(--nx-texto); cursor:pointer; }
.b-gris { background:var(--nx-azul-fondo); color:var(--nx-azul); }
.b-azul { background:var(--nx-tinta); color:var(--nx-tinta-clara); }
.b-rojo { background:var(--nx-rojo); color:#fff; }
.b-verde { background:var(--nx-verde); color:#fff; }
.miniaturas { display:flex; gap:8px; flex-wrap:wrap; }
.miniaturas img { width:72px; height:72px; object-fit:cover; border-radius:10px; }
.ausente button.intento { width:100%; min-height:52px; border:0; border-radius:12px; background:var(--nx-ambar-fondo); color:var(--nx-ambar-tinta);
  font:800 16px var(--nx-texto); margin-bottom:8px; cursor:pointer; }
.ausente button.intento:disabled { background:var(--nx-verde-fondo); color:var(--nx-verde-tinta); }
.ausente .cuenta { font-size:14px; font-weight:700; }
.btn-foto { width:100%; min-height:52px; border:0; border-radius:12px; background:var(--nx-azul-fondo); color:var(--nx-azul); font:800 15px var(--nx-texto); cursor:pointer; }

/* Lectura de la foto con varios tickets (multi-ticket) */
#lotes { display:flex; flex-direction:column; gap:12px; }
.lote { background:var(--nx-superficie); border-radius:var(--nx-r-tarjeta); padding:14px; display:flex; flex-direction:column; gap:8px; }
.lote-cab { display:flex; align-items:center; gap:8px; font-weight:800; font-size:15px; }
.lote-cab .grow { flex:1; }
.lote-cab button { min-height:40px; border:0; border-radius:10px; padding:0 12px; font:800 14px var(--nx-texto); background:var(--nx-azul-fondo); color:var(--nx-azul); cursor:pointer; }
.lote-res { font-size:13px; font-weight:700; color:var(--nx-suave); }
.lote-leyendo { text-align:center; padding:18px 8px; font-weight:800; }
.lote-leyendo .rueda { width:36px; height:36px; border:4px solid var(--nx-azul-fondo); border-top-color:var(--nx-tinta); border-radius:50%;
  margin:0 auto 10px; animation:gira 1s linear infinite; }
@keyframes gira { to { transform:rotate(360deg); } }
.tk { background:var(--nx-campo); border-radius:12px; padding:10px; display:flex; gap:10px; align-items:flex-start; border-left:6px solid transparent; }
.tk.ok { border-left-color:var(--nx-verde); }
.tk.rev { border-left-color:var(--nx-lampara); background:#FFF8E1; }
.tk.mal { border-left-color:var(--nx-rojo); }
.tk.fuera { opacity:.55; }
.tk .mini { width:64px; height:96px; object-fit:cover; object-position:top; border-radius:8px; background:var(--nx-chip); flex:0 0 auto; }
.tk .cuerpo { flex:1; min-width:0; font-size:14px; }
.tk .titulo { font-weight:800; font-size:15px; }
.tk .estado { font-size:13px; margin-top:2px; }
.tk .form { margin-top:8px; }
.tk .form .g { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; }
.tk .form label { font-size:12px; color:var(--nx-suave); font-weight:700; display:block; margin-top:6px; }
.tk .form input { width:100%; height:44px; padding:0 8px; border:1.5px solid var(--nx-linea); border-radius:10px; background:var(--nx-superficie);
  color:var(--nx-tinta); font:700 16px var(--nx-texto); }
.tk .form input.oblig { border-color:var(--nx-lampara); }
.tk .form .btns { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
.tk .form .btns button { flex:1; min-height:48px; border:0; border-radius:12px; font:800 14px var(--nx-texto); cursor:pointer; }
.tk .form label.chkman { display:flex; align-items:center; gap:8px; font-size:13px; margin-top:10px; color:var(--nx-tinta); }
.tk .form label.chkman input { width:22px; height:22px; flex:0 0 auto; }
.b-add { width:100%; min-height:48px; border:1.5px dashed var(--nx-linea); border-radius:12px; background:transparent; color:var(--nx-azul);
  font:800 15px var(--nx-texto); cursor:pointer; }
#spin { position:fixed; inset:0; z-index:300; background:rgba(11,36,71,.62); display:none; align-items:center; justify-content:center;
  color:#fff; font-weight:800; font-size:16px; }
#spin.on { display:flex; }
</style>
</head>
<body class="nx">
<header class="nx-cab">
  <a class="nx-cab-logo" href="index.html" aria-label="Ir al inicio"><img src="nexo-logo-oficial.png" alt="Nexo"><span class="nx-cab-seccion">Reparto</span></a>
  <div class="nx-cab-usuario"><span id="quien"></span></div>
</header>
<main class="nx-pag">
  <h1 class="nx-titulo">Pedidos asignados</h1>
  <!-- Fase 1 multi-ticket: resultado de la lectura de la foto -->
  <div id="lotes"></div>
  <div class="nx-pestanas" role="tablist">
    <button class="tab" id="tabRuta" role="tab" onclick="cambiarTab('ruta')">Asignados</button>
    <button class="tab" id="tabDisp" role="tab" onclick="cambiarTab('disp')">Disponibles</button>
  </div>
  <div class="info" id="info"></div>
  <div id="msg"></div>
  <div id="lista"></div>
  <div class="nx-version" data-nexo-version="Nexo · Pedidos asignados">Nexo · Pedidos asignados v3.10.1</div>
</main>

<div class="barra" id="barra"><button id="btnAsignar" onclick="asignarSeleccion()">Asignar a mi ruta (0)</button></div>

<!-- Modal foto ticket -->
<div class="modal" id="mFoto"><div class="box">
  <h2>Foto del ticket</h2>
  <div id="fotoCont" style="text-align:center;padding:20px">Cargando…</div>
  <div class="row"><button class="b-azul" onclick="cerrar('mFoto')">Cerrar</button></div>
</div></div>

<!-- Modal incidencia -->
<div class="modal" id="mInc"><div class="box">
  <h2 id="incTitulo">Incidencia</h2>
  <div id="incTipos"></div>
  <div id="incAusente" class="ausente" style="display:none"></div>
  <div id="incObsWrap" style="display:none">
    <textarea id="incObs" placeholder="Observaciones"></textarea>
  </div>
  <div id="incFotoWrap" style="display:none">
    <button class="btn-foto" id="btnIncFoto" onclick="document.getElementById('incFile').click()">Añadir foto</button>
    <div class="miniaturas" id="incMini"></div>
  </div>
  <input type="file" id="incFile" accept="image/*" capture="environment" style="display:none" />
  <div class="row">
    <button class="b-gris" onclick="cerrar('mInc')">Cancelar</button>
    <button class="b-rojo" id="btnIncEnviar" onclick="enviarIncidencia()">Registrar</button>
  </div>
</div></div>

<div id="spin">Procesando…</div>

<script>
/* ============ CONFIG ============ */
/* URL /exec del NUEVO Apps Script del módulo Embolsado (pegar aquí tras desplegar) */
var EMBOLSADO_URL = 'https://script.google.com/macros/s/AKfycbxvyzpNQObvloq0tuoDisEn4qrGWh0tEGfGHn4NXoEqP1ShODyIWQ1bzYyWfcuz_Pqh/exec';
var PROXY = 'https://sad-proxy.colatino-ventas-enlinea.workers.dev/';

var SESION = {};
try { SESION = JSON.parse(sessionStorage.getItem('sad_user') || '{}'); } catch (e) {}
var USUARIO = SESION.usuario || '';
document.getElementById('quien').textContent = (SESION.nombre || USUARIO);

var TIPOS = {
  CLIENTE_AUSENTE:      { etiqueta: 'Cliente ausente',            fotosMax: 2, obs: false },
  DIRECCION_INCORRECTA: { etiqueta: 'Dirección incorrecta',       fotosMax: 0, obs: true },
  PRODUCTO_FALTANTE:    { etiqueta: 'Producto faltante o dañado', fotosMax: 3, obs: true },
  COMPRA_RECHAZADA:     { etiqueta: 'Compra rechazada',           fotosMax: 0, obs: true },
  FRIO_OLVIDADO:        { etiqueta: 'Frío olvidado',              fotosMax: 0, obs: true }
};

function api(accion, datos) {
  var body = Object.assign({ accion: accion, usuario: USUARIO }, datos || {});
  return fetch(PROXY + '?url=' + encodeURIComponent(EMBOLSADO_URL), {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
  }).then(function (r) { return r.json(); }).catch(function (e) {
    return { ok: false, error: 'Sin conexión con el servidor.' };
  });
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function msg(t, tipo) { var m = document.getElementById('msg'); m.className = tipo || ''; m.textContent = t || ''; if (!t) m.style.display = 'none'; if (t) setTimeout(function () { if (m.textContent === t) msg(''); }, 6000); }
function spin(on) { document.getElementById('spin').classList.toggle('on', !!on); }
function cerrar(id) { document.getElementById(id).classList.remove('on'); }

/* ============ ESTADO ============ */
var tab = 'disp', disp = [], ruta = [], sel = {}, tramos = [];
var entAdm = null, abiertoEnt = false;   // ronda 24: entregados de hoy (ADM: de todos) y si el bloque está abierto
/* Pedidos %DIA asignados a mí (backend NEXO · DIA) — se muestran en rosa en "Asignados" */
var DIA_URL = 'https://script.google.com/macros/s/AKfycbwrX90CKa7GQki-DUDZFpdGVlGIXZvmiHsRKCEW7ZwBbYkKfYPr3R1kx96Uz9GKL_0m/exec', diaRuta = [];
function apiDia(accion, datos) {
  if (/^PEGAR_AQUI/.test(DIA_URL)) return Promise.resolve({ ok: true, pedidos: [] });
  var body = Object.assign({ accion: accion, usuario: USUARIO }, datos || {});
  return fetch(PROXY + '?url=' + encodeURIComponent(DIA_URL), {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
  }).then(function (r) { return r.json(); }).catch(function () { return { ok: false, pedidos: [] }; });
}
function diaCardHTML(o) {
  var hoy = new Date(), hoyIso = hoy.getFullYear() + '-' + ('0' + (hoy.getMonth() + 1)).slice(-2) + '-' + ('0' + hoy.getDate()).slice(-2);
  var al = '', falta = o.finTramo == null ? null : o.finTramo - (hoy.getHours() * 60 + hoy.getMinutes());
  if (o.fecha && o.fecha < hoyIso) al = 'tarde'; else if (o.fecha === hoyIso && falta != null) al = falta <= 0 ? 'tarde' : falta <= 30 ? 'alerta' : '';
  var f = String(o.fecha || '').split('-');
  var h = '<div class="card dia' + (al ? ' ' + al : '') + '">';
  if (al) h += '<div class="dia-aviso">' + (al === 'tarde' ? 'Tramo terminado — pedido sin entregar' : 'Quedan menos de 30 min del tramo') + '</div>';
  h += '<div class="sup"><div class="num-box"><span class="n largo">%DIA</span><span class="s">' + esc(o.tienda || '') + '</span></div>';
  h += '<div class="der"><div class="cab"><span class="tag">' + esc(o.tramo) + '</span><span class="tag">' + (f.length === 3 ? f[2] + '/' + f[1] + '/' + f[0] : esc(o.fecha)) + '</span>' + (ES_ADMIN && o.estadoNexo === 'ENTREGADO' && o.repartidor ? '<span class="tag rep">' + esc(String(o.repartidor).toUpperCase()) + '</span>' : '') + '</div>';
  h += '<div class="cliente">' + esc(o.cliente || '—') + '</div>';
  (o.telefonos || []).forEach(function (t) { h += '<div class="fila"><a class="tel" href="tel:' + esc(t) + '">' + IC_TEL + esc(t) + '</a></div>'; });
  h += '</div></div>';
  h += '<div class="fila"><b>Dirección</b>' + esc(o.direccion || '—') + '</div>';
  h += '<div class="chips"><span class="chip">Albarán ' + esc(o.albaran) + '</span><span class="chip">Seco ' + esc(o.seco || 0) + '</span><span class="chip">Fresco ' + esc(o.fresco || 0) + '</span><span class="chip">Congelado ' + esc(o.congelado || 0) + '</span></div>';
  if (o.observaciones) h += '<div class="fila"><b>Observaciones</b>' + esc(o.observaciones) + '</div>';
  if (o.estadoNexo === 'ENTREGADO') {
    h += '<div class="acciones hecho" style="grid-template-columns:1fr"><button class="b-hecho" disabled>' + IC_OK + 'Entregado' + horaCorta(o.entregaHora) + '</button></div>';
    if (ES_ADMIN) h += '<button class="b-deshacer" onclick="deshacer(\'dia\',\'' + esc(o.id) + '\',\'' + esc(o.repartidor || o.asignadoA || '') + '\')">Deshacer entrega</button>';
  }
  else h += '<div class="acciones" style="grid-template-columns:minmax(0,1fr) minmax(0,1.25fr)"><a class="b-inc" href="dia.html?id=' + encodeURIComponent(o.id) + '&inc=1">Incidencia</a>' +
       '<a class="b-ent" href="dia.html?id=' + encodeURIComponent(o.id) + '">' + IC_OK + 'Entregar</a></div>';
  return h + '</div>';
}

function cambiarTab(t) {
  tab = t; sel = {};
  document.getElementById('tabDisp').classList.toggle('on', t === 'disp');
  document.getElementById('tabRuta').classList.toggle('on', t === 'ruta');
  pintar();
}

async function cargar(inicial) {
  spin(true);
  var rr = await api('listarMiRuta');

/* ============ RECORTE VIRTUAL ============
   box = [ymin, xmin, ymax, xmax] en escala 0-1000 (formato de Gemini). */
var _imgCache = {};
function cargarImg(src) {
  if (_imgCache[src]) return _imgCache[src];
  _imgCache[src] = new Promise(function (res, rej) {
    var i = new Image(); i.onload = function () { res(i); }; i.onerror = function () { rej(new Error('img')); }; i.src = src;
  });
  return _imgCache[src];
}
async function recortar(src, box, maxAncho) {
  var b = Array.isArray(box) ? box : String(box || '').split(',').map(Number);
  if (b.length !== 4 || b.some(isNaN)) return src;
  var img = await cargarImg(src);
  var W = img.naturalWidth, H = img.naturalHeight, m = 12; // margen de 1,2 %
  var y0 = Math.max(0, (b[0] - m) / 1000 * H), x0 = Math.max(0, (b[1] - m) / 1000 * W);
  var y1 = Math.min(H, (b[2] + m) / 1000 * H), x1 = Math.min(W, (b[3] + m) / 1000 * W);
  var w = x1 - x0, h = y1 - y0; if (w < 10 || h < 10) return src;
  var s = Math.min(1, (maxAncho || 900) / w);
  var c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(h * s);
  c.getContext('2d').drawImage(img, x0, y0, w, h, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.88);
}

function pintarAusente() {
  var n = incIntentos.length;
  var h = '<button class="intento" onclick="nuevoIntento()" ' + (n >= 3 ? 'disabled' : '') + '>Registrar llamada (' + n + '/3)</button>';
  if (n) h += '<div class="cuenta" id="cuenta"></div>';
  document.getElementById('incAusente').innerHTML = h;
  tick();
  clearInterval(incTimer); if (n) incTimer = setInterval(tick, 1000);
}
function nuevoIntento() { if (incIntentos.length < 3) { incIntentos.push(Date.now()); pintarAusente(); } }
function faltaEspera() { return incIntentos.length ? Math.max(0, incIntentos[0] + 10 * 60 * 1000 - Date.now()) : 1; }
function tick() {
  var c = document.getElementById('cuenta'); if (!c) return;
  var f = faltaEspera(), n = incIntentos.length;
  var t = incIntentos.map(function (x) { return new Date(x).toLocaleTimeString('es-ES'); }).join(' · ');
  if (n < 3) c.textContent = 'Tentativas: ' + t;
  else if (f > 0) c.textContent = 'Tentativas: ' + t + ' — espera ' + Math.floor(f / 60000) + ':' + String(Math.floor(f % 60000 / 1000)).padStart(2, '0') + ' para poder registrar.';
  else c.textContent = 'Tentativas: ' + t + ' — espera de 10 min cumplida.';
}

document.getElementById('incFile').addEventListener('change', async function (ev) {
  var f = ev.target.files[0]; ev.target.value = '';
  if (!f || !incTipo) return;
  if (incFotos.length >= TIPOS[incTipo].fotosMax) { msg('Máximo de fotos alcanzado.', 'err'); return; }
  var d = await reducir(f, 1400);
  incFotos.push(d);
  document.getElementById('incMini').innerHTML = incFotos.map(function (x) { return '<img src="' + x + '">'; }).join('');
});

function reducir(file, max) {
  return new Promise(function (res, rej) {
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function () {
      var s = Math.min(1, max / Math.max(img.width, img.height));
      var c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.75));
    };
    img.onerror = function () { rej(new Error('No se pudo leer la foto')); };
    img.src = url;
  });
}

  }

  var r = await api('registrarIncidencia', { id: incId, tipo: incTipo, observaciones: obs, intentos: incIntentos, fotos: incFotos });

/* =====================================================================
   FASE 1 MULTI-TICKET — lectura de la foto subida en index.html
   index.html guarda la foto en IndexedDB ('nexo-lotes') y viene aquí.
   Se procesa cada lote pendiente: Gemini lee los tickets, el servidor
   graba y asigna los que coinciden (CAJA + TICKET en la fecha/franja) y
   los demás quedan en naranja para confirmar a mano.
===================================================================== */
var LOTES_DB = 'nexo-lotes';
var LOTES = {};   // id -> { lote, res, items:[...] }
var ES_ADMIN = String(SESION.nivel || '').toLowerCase().trim() === 'admin';

function abrirLotesDB() {
  return new Promise(function (res, rej) {
    var r = indexedDB.open(LOTES_DB, 1);
    r.onupgradeneeded = function () { if (!r.result.objectStoreNames.contains('lotes')) r.result.createObjectStore('lotes', { keyPath: 'id' }); };
    r.onsuccess = function () { res(r.result); };
    r.onerror = function () { rej(r.error); };
  });
}
function lotesPendientes() {
  return abrirLotesDB().then(function (db) {
    return new Promise(function (res, rej) {
      var q = db.transaction('lotes', 'readonly').objectStore('lotes').getAll();
      q.onsuccess = function () { res((q.result || []).sort(function (a, b) { return a.ts - b.ts; })); };
      q.onerror = function () { rej(q.error); };
    });
  }).catch(function () { return []; });
}
function borrarLote(id) {
  return abrirLotesDB().then(function (db) {
    return new Promise(function (res) {
      var tx = db.transaction('lotes', 'readwrite'); tx.objectStore('lotes').delete(id);
      tx.oncomplete = function () { res(); }; tx.onerror = function () { res(); };
    });
  }).catch(function () {});
}

         '<button class="b-add" onclick="procesarLote(\'' + esc(id) + '\')">Reintentar</button>';
  } else {
    var n = L.items.filter(function (x) { return x.estado === 'ASIGNADO' || x.estado === 'GRABADO'; }).length;
    var rev = pendientesRevision(L);
    h += '<div class="lote-res">' + L.items.filter(function (x) { return x.estado !== 'DESCARTADO'; }).length + ' ticket(s) · ' +
         n + ' listo(s)' + (rev ? ' · <b>' + rev + ' por revisar</b>' : '') + '</div>';
    if (L.aviso) h += '<div class="lote-res">' + esc(L.aviso) + '</div>';
    L.items.forEach(function (it, i) { h += itemHTML(id, i, it); });
    h += '<button class="b-add" onclick="anadirTicket(\'' + esc(id) + '\')">Añadir un ticket que falta</button>';
  }
  cont.innerHTML = h;
  // Miniaturas (recorte virtual en el propio móvil, con la foto local).
  if (L.estado === 'listo') L.items.forEach(function (it, i) {
    if (!it.box || it.mini) return;
    recortar(l.imagen, it.box, 360).then(function (u) {
      it.mini = u; var im = document.getElementById('mi_' + id + '_' + i); if (im) im.src = u;
    }).catch(function () {});
  });
}

function pendientesRevision(L) {
  return (L.items || []).filter(function (x) { return x.estado === 'REVISAR' || x.estado === 'DUPLICADO'; }).length;
}

function itemHTML(id, i, it) {
  var et = ETIQUETAS[it.estado] || ETIQUETAS.REVISAR;
  var d = it.datos || {};
  var key = esc(id) + "'," + i;
  var h = '<div class="tk ' + et.cls + '">';
  h += it.box ? '<img class="mini" id="mi_' + esc(id) + '_' + i + '" src="' + (it.mini || '') + '" onclick="verMini(\'' + key + ')">' : '<div class="mini"></div>';
  h += '<div class="cuerpo"><div class="titulo">' + (it.caja || it.ticket ? 'Caja ' + esc(it.caja || '?') + ' · Ticket ' + esc(it.ticket || '?') : 'Ticket sin leer') +
       (it.manual ? ' · MANUAL' : '') + '</div>';
  var nombre = it.nombre || d.nombre;
  if (nombre) h += '<div>' + esc(nombre) + '</div>';
  var dir = it.direccion || d.direccion;
  if (dir) h += '<div style="font-size:13px;color:var(--nx-suave)">' + esc(dir) + '</div>';
  h += '<div class="estado"><b>' + et.txt + '</b>' + (it.mensaje ? ' — ' + esc(it.mensaje) : '') + '</div>';

  if (it.estado === 'REVISAR' || it.estado === 'DUPLICADO') {
    var L = LOTES[id].lote;
    var p = 'f_' + esc(id) + '_' + i + '_';
    h += '<div class="form">' +
      '<div class="g">' +
        '<div><label>Fecha entrega *</label><input class="oblig" type="date" id="' + p + 'fecha" value="' + esc(it.fechaForm || L.fecha) + '"></div>' +
        '<div><label>Caja *</label><input class="oblig" inputmode="numeric" maxlength="3" id="' + p + 'caja" value="' + esc(it.caja || '') + '"></div>' +
        '<div><label>Ticket *</label><input class="oblig" inputmode="numeric" id="' + p + 'ticket" value="' + esc(it.ticket || '') + '"></div>' +
      '</div>' +
      '<label>Nombre</label><input id="' + p + 'nombre" value="' + esc(d.nombre || '') + '">' +
      '<label>Dirección</label><input id="' + p + 'direccion" value="' + esc(d.direccion || '') + '">' +
      '<div class="g">' +
        '<div><label>Teléfono</label><input inputmode="tel" id="' + p + 'telefono" value="' + esc(d.telefono || '') + '"></div>' +
        '<div><label>Nº cajas</label><input id="' + p + 'n_cajas" value="' + esc(d.n_cajas == null ? '' : d.n_cajas) + '"></div>' +
        '<div><label>F / N / C</label><input id="' + p + 'fnc" placeholder="1/2/0" value="' + esc([d.frios, d.nevera, d.congelados].map(function (x) { return x == null ? '' : x; }).join('/').replace(/^\/\/$/, '')) + '"></div>' +
      '</div>' +
      '<label class="chkman"><input type="checkbox" id="' + p + 'manual"' + (it.manual ? ' checked' : '') + '> Ticket manual (se graba como "nº Manual")</label>' +
      '<div class="btns">' +
        '<button class="b-verde" onclick="resolver(\'' + key + ',false)">Guardar y asignar</button>' +
        '<button class="b-azul" onclick="resolver(\'' + key + ',true)">Saltar (solo asignar)</button>' +
        '<button class="b-gris" onclick="descartar(\'' + key + ')">Descartar</button>' +
      '</div></div>';
  }
  return h + '</div></div>';
}

function verMini(id, i) {
  var L = LOTES[id], it = L.items[i];
  recortar(L.lote.imagen, it.box, 1400).then(verImagen).catch(function () { verImagen(L.lote.imagen); });
}

async function procesarLote(id) {
  var L = LOTES[id]; L.estado = 'leyendo'; pintarLote(id);
  var l = L.lote;
  var r = await api('procesarFotoMultiple', {
    imagenBase64: l.imagen, fecha: l.fecha, franja: l.franja, tienda: l.tienda,
    repartidor: l.repartidor, asignar: l.asignar !== false
  });
  if (!r.ok) {
    L.estado = 'error'; L.error = r.error || 'Error desconocido';
    pintarLote(id);
    return;
  }
  // El servidor ya tiene la foto y los datos: se borra la copia del móvil
  // (la imagen se queda en memoria mientras esta página esté abierta).
  await borrarLote(id);
  L.res = r; L.estado = 'listo'; L.aviso = r.avisoOcr || '';
  L.items = (r.tickets || []).map(function (t) { return t; });
  pintarLote(id);
}

function leerForm(id, i) {
  var p = 'f_' + id + '_' + i + '_';
  function v(k) { var e = document.getElementById(p + k); return e ? (e.type === 'checkbox' ? e.checked : e.value.trim()) : ''; }
  var fnc = String(v('fnc') || '').split('/');
  return {
    fecha: v('fecha'), caja: v('caja'), ticket: v('ticket'), manual: v('manual'),
    datos: { nombre: v('nombre'), direccion: v('direccion'), telefono: v('telefono'), n_cajas: v('n_cajas'),
             frios: (fnc[0] || '').trim(), nevera: (fnc[1] || '').trim(), congelados: (fnc[2] || '').trim() }
  };
}

async function resolver(id, i, saltar) {
  var L = LOTES[id], it = L.items[i], f = leerForm(id, i);
  if (!f.fecha || !f.caja || !f.ticket) { alert('Fecha de entrega, caja y ticket son obligatorios.'); return; }
  var datos = Object.assign({}, it.datos || {}, f.datos);
  spin(true);
  var r = await api('resolverTicketLote', {
    fotoId: L.res.fotoId, box: it.box || '', fecha: f.fecha, franja: L.res.franja || L.lote.franja,
    caja: f.caja, ticket: f.ticket, datos: datos, repartidor: L.lote.repartidor,
    asignar: L.lote.asignar !== false, saltar: !!saltar, manual: !!f.manual
  });
  spin(false);
  if (!r.ok) { alert(r.error || 'No se pudo guardar.'); return; }
  it.estado = r.estado; it.mensaje = r.mensaje; it.caja = r.caja; it.ticket = r.ticket;
  it.nombre = r.nombre; it.direccion = r.direccion; it.manual = !!f.manual; it.datos = datos;
  pintarLote(id);
  cargar(false);
}

function descartar(id, i) {
  if (!confirm('¿Descartar este ticket? No se graba ni se asigna.')) return;
  var it = LOTES[id].items[i]; it.estado = 'DESCARTADO'; it.mensaje = '';
  pintarLote(id);
}

function anadirTicket(id) {
  var L = LOTES[id];
  L.items.push({ idx: L.items.length, estado: 'REVISAR', mensaje: 'Añadido a mano: escribe fecha, caja y ticket.', caja: '', ticket: '', box: '', datos: {} });
  pintarLote(id);
}

function cerrarLote(id) {
  var c = document.getElementById('lt_' + id); if (c) c.remove();
  delete LOTES[id];
}

async function procesarPendientes() {
  var lista = await lotesPendientes();
  // Solo los lotes de este usuario (si el móvil se comparte, no se mezclan).
  lista = lista.filter(function (l) { return !l.usuario || l.usuario === USUARIO; });
  if (!lista.length) return false;
  cambiarTab('ruta');
  for (var k = 0; k < lista.length; k++) {
    LOTES[lista[k].id] = { lote: lista[k], estado: 'leyendo', items: [] };
    pintarLote(lista[k].id);
  }
  for (var j = 0; j < lista.length; j++) await procesarLote(lista[j].id);
  return true;
}

// Aviso si se sale de la página mientras se leen tickets.
window.addEventListener('beforeunload', function (e) {
  var leyendo = Object.keys(LOTES).some(function (k) { return LOTES[k].estado === 'leyendo'; });
  if (leyendo) { e.preventDefault(); e.returnValue = ''; }
});

if (EMBOLSADO_URL.indexOf('PEGAR_AQUI') === 0) msg('Falta configurar EMBOLSADO_URL en asignar.html', 'err');
else {
  cargar(true);
  procesarPendientes().then(function (hubo) { if (hubo) cargar(false); });
}
</script>
</body>
</html>
