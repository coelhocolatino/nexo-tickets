<!DOCTYPE html>
<!-- Nexo · Reservas (puente) — v3.10.1 (2026-10-09, ronda 24): diseño nuevo con el logo oficial.
     Reenvía al Módulo de Reservas (Apps Script) con el usuario ya logueado (?u=usuario). -->
<html lang="es" data-pagina="reservas" data-version="v3.10.1">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#E8EDF3" />
<title>Nexo · Reservas</title>
<link rel="icon" href="nexo-icon-192.png">
<link rel="stylesheet" href="nexo-tema.css?v=24">
<style>
body { min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;
  padding:24px; text-align:center; background:var(--nx-fondo,#E8EDF3); color:var(--nx-tinta,#0B2447); font-family:var(--nx-texto,system-ui,sans-serif); }
.caja { width:100%; max-width:360px; background:var(--nx-superficie,#FBFCFA); border-radius:24px; padding:28px 20px; display:flex; flex-direction:column; align-items:center; gap:18px; }
.logo { width:200px; max-width:70vw; height:auto; }
h1 { margin:0; font-family:var(--nx-display,'Arial Narrow',sans-serif); font-weight:800; font-size:32px; line-height:1; }
@keyframes gira { to { transform:rotate(360deg); } }
.rueda { width:44px; height:44px; border:5px solid var(--nx-azul-fondo,#DCE7FB); border-top-color:var(--nx-tinta,#0B2447); border-radius:50%; animation:gira .8s linear infinite; }
p { margin:0; color:var(--nx-suave,#4F6078); font-size:15px; font-weight:600; }
a.manual { min-height:48px; display:inline-flex; align-items:center; padding:0 16px; border-radius:12px; background:var(--nx-azul-fondo,#DCE7FB);
  color:var(--nx-azul,#17409E); font-weight:800; font-size:15px; text-decoration:none; }
</style>
</head>
<body>
<div class="caja">
  <img class="logo" src="nexo-logo-oficial.png" alt="Nexo" />
  <h1>Reservas</h1>
  <div class="rueda" aria-hidden="true"></div>
  <p id="txt">Abriendo el Módulo de Reservas…</p>
  <a class="manual" id="linkManual" href="#">Si no se abre solo, toca aquí</a>
</div>
<script>
// URL ".../exec" del proyecto de Apps Script del Módulo de Reservas.
var RESERVAS_EXEC_URL = "https://script.google.com/macros/s/AKfycbwXkz9LoSa2ucdz9x1_wD9Z0BMsRe9R2vrnZ_MZEeKGSpKN55EQM3cVQLYtdeOL9JwP/exec";
// Reenvía el usuario ya logueado en Nexo Tickets (?u=usuario) para que entre directo.
var usuario = new URLSearchParams(window.location.search).get('u') || '';
var urlFinal = RESERVAS_EXEC_URL + (usuario ? (RESERVAS_EXEC_URL.indexOf('?') === -1 ? '?' : '&') + 'u=' + encodeURIComponent(usuario) : '');
document.getElementById('linkManual').href = urlFinal;
window.location.replace(urlFinal);
</script>
</body>
</html>
