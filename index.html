<!DOCTYPE html>
<!-- Nexo Tickets — index.html (Inicio)
     v3.11.1 (2026-10-19, ronda 45): botón «Flota» (flota.html) para todos.
     v3.11.0 (2026-10-19, ronda 43): el inicio pasa a ser SOLO BOTONERA. El
     formulario de subir ticket se muda a auto.html (botón «Auto-Asignar»), que
     funciona igual que hasta ahora pero marca el archivo con AUTO al final del
     nombre. Cada usuario ve únicamente los botones que tiene permitidos, con
     las mismas reglas de siempre (NIVEL + DEPARTAMENTO + TIENDA de la hoja
     USUARIOS), las mismas que usa la barra de accesos (nexo-nav.js):
       · %DIA, Incidencias, Informe y Auto-Asignar: todos.
       · Pedidos asignados: ADM o tienda TRAVESIA / GRANVIA.
       · Reservas: ADM o TRAVESIA.   · Embolsado: ADM o departamento EMBOLSADO.
       · Actualizar pedidos y Configuración: solo ADM.
     Los globos de %DIA e Incidencias los sigue calculando nexo-nav.js: aquí
     solo se copian a los botones, sin pedir nada más al servidor.
     El departamento EMBOLSADO (sin ser ADM) sigue yendo a inicio-embolsado.html. -->
<html lang="es" data-pagina="index" data-version="v3.11.2">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FEFEFE" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Nexo Tickets" />
<link rel="manifest" href="manifest.json?v=5">
<link rel="icon" href="nexo-icon-192.png">
<link rel="apple-touch-icon" href="nexo-icon-192.png">
<title>Nexo · Inicio</title>
<link rel="stylesheet" href="nexo-tema.css?v=28">
<script src="nexo-version.js?v=1"></script>
<script src="nexo-nav.js?v=2"></script>
<script src="nexo-novedades.js?v=2"></script>

<style>
.botonera { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px; }
.bot { position:relative; display:flex; flex-direction:column; justify-content:space-between; gap:10px;
  min-height:112px; padding:14px; border:0; border-radius:var(--nx-r-tarjeta); background:var(--nx-superficie);
  color:var(--nx-tinta); font-family:inherit; font-size:16px; font-weight:800; line-height:1.15; text-align:left;
  text-decoration:none; cursor:pointer; transition:transform .12s; }
.bot:active { transform:scale(.97); }
.bot .ic { display:flex; align-items:center; justify-content:center; width:42px; height:42px; border-radius:12px;
  background:var(--nx-azul-fondo); color:var(--nx-azul); }
.bot .sub { display:block; font-size:12px; font-weight:700; color:var(--nx-suave); margin-top:2px; }
.bot.fuerte { background:var(--nx-tinta); color:var(--nx-tinta-clara); }
.bot.fuerte .ic { background:rgba(255,255,255,.14); color:var(--nx-tinta-clara); }
.bot.fuerte .sub { color:#B9C7DD; }
.bot.ancho { grid-column:1 / -1; flex-direction:row; align-items:center; min-height:72px; }
.bot .num { position:absolute; top:10px; right:10px; display:none; min-width:26px; height:26px; padding:0 7px;
  border-radius:999px; align-items:center; justify-content:center; font-size:13px; font-weight:800;
  background:var(--nx-lampara); color:var(--nx-tinta); box-shadow:0 0 0 2px var(--nx-superficie); }
.bot .num.rojo { background:var(--nx-rojo); color:#fff; }
.bot .num.on { display:flex; }
.grupo-tit { margin:8px 2px 0; font-size:12px; font-weight:800; letter-spacing:.06em; color:var(--nx-suave); text-transform:uppercase; }
#msg { min-height:20px; font-size:14px; font-weight:800; text-align:center; }

/* Spinner (igual que en el resto de páginas) */
#spinner { position:fixed; inset:0; background:rgba(11,36,71,.55); display:none; align-items:center; justify-content:center;
  flex-direction:column; gap:14px; z-index:1200; }
#spinner.visible { display:flex; }
#spinner-ring { width:52px; height:52px; border:5px solid rgba(255,255,255,.3); border-top-color:#fff; border-radius:50%; animation:nxGira 1s linear infinite; }
@keyframes nxGira { to { transform:rotate(360deg); } }
#spinner-text { color:#fff; font-size:15px; font-weight:800; }
</style>

<!-- GUARD DE SESIÓN: redirige antes de pintar nada -->
<script>
(function sessionGuard() {
  try {
    var raw = sessionStorage.getItem('sad_user');
    if (!raw) { window.location.replace('login.html'); return; }
    var u = JSON.parse(raw);
    if (!u || !u.usuario || !u.token) {
      sessionStorage.removeItem('sad_user');
      window.location.replace('login.html');
      return;
    }
    if (typeof u.tiendaPre === 'undefined') {
      sessionStorage.removeItem('sad_user');
      window.location.replace('login.html');
      return;
    }
    // Departamento EMBOLSADO (2026-10-02): tiene su propia página de inicio.
    // Los ADM se quedan en este index.
    if (String(u.departamento || '').toUpperCase().trim() === 'EMBOLSADO' &&
        String(u.nivel || '').toLowerCase().trim() !== 'admin') {
      window.location.replace('inicio-embolsado.html');
    }
  } catch (e) {
    sessionStorage.removeItem('sad_user');
    window.location.replace('login.html');
  }
})();
</script>
</head>
<body class="nx">

<div id="spinner" role="status" aria-live="polite">
  <div id="spinner-ring"></div>
  <div id="spinner-text">Procesando…</div>
</div>

<header class="nx-cab">
  <a class="nx-cab-logo" href="index.html" aria-label="Ir al inicio"><img src="nexo-logo-oficial.png" alt="Nexo" width="480" height="194"><span class="nx-cab-seccion">Inicio</span></a>
  <div class="nx-cab-usuario" id="userBadge">
    <span id="badgeNombre">—</span>
    <span class="nx-nivel nivel-tag" id="nivelTag">—</span>
    <button type="button" class="nx-salir" onclick="cerrarSesion()">Salir</button>
  </div>
</header>

<main class="nx-pag">
  <h1 class="nx-titulo">Inicio</h1>
  <div id="msg" role="alert" aria-live="polite"></div>
  <div class="botonera" id="botonera"></div>
  <button type="button" class="nx-btn texto" data-nexo-novedades style="align-self:center">Qué novedades hay</button>
  <div class="nx-version app-version" data-nexo-version="Nexo Tickets">Nexo Tickets</div>
</main>

<script>
/* ============================================================
   SESIÓN Y PERMISOS (las mismas reglas que nexo-nav.js)
============================================================ */
var sesion = {};
try { sesion = JSON.parse(sessionStorage.getItem('sad_user') || '{}'); } catch (e) {}
var NIVEL    = String(sesion.nivel || '').toLowerCase().trim() || 'usuario 1';
var ES_ADMIN = NIVEL === 'admin';
var DEPTO    = String(sesion.departamento || '').toUpperCase().trim();
var ES_EMB   = DEPTO === 'EMBOLSADO';
var TIENDA   = String(sesion.tiendaPre || '');
var ES_TRAV  = /trav[eé]s[ií]a/i.test(TIENDA);
var ES_GRAN  = /granv[ií]a/i.test(TIENDA);
var USR      = encodeURIComponent(sesion.usuario || '');

document.getElementById('badgeNombre').textContent = sesion.nombre || sesion.usuario || '—';
var nivelTag = document.getElementById('nivelTag');
nivelTag.textContent = NIVEL;
if (ES_ADMIN) nivelTag.classList.add('admin');

var EMBOLSADO_URL       = 'https://script.google.com/macros/s/AKfycbxvyzpNQObvloq0tuoDisEn4qrGWh0tEGfGHn4NXoEqP1ShODyIWQ1bzYyWfcuz_Pqh/exec';
var CONTROL_TICKETS_URL = 'https://script.google.com/macros/s/AKfycbzEnq5PYv_9pAi-d-dRi-M69rxPxW62Qd3vy61qvGxR9s-YxgkYdWlZ7b2alJrXAt1sYg/exec';
var BACKEND_URL         = 'https://script.google.com/macros/s/AKfycbzkf4K28coJa5YXNv_iN08sfhjrtKenyFJgHxWaIxMGVtuABHswvySAFEmowq5vP4rD/exec';
var PROXY_BASE          = 'https://sad-proxy.colatino-ventas-enlinea.workers.dev/';
function postProxy(url, body) {
  return fetch(PROXY_BASE + '?url=' + encodeURIComponent(url), {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
  }).then(function (r) {
    return r.text().then(function (t) {
      try { return JSON.parse(t); }
      catch (e) { return { ok: false, error: 'Respuesta inesperada (' + r.status + '): ' + t.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 140) }; }
    });
  });
}

/* ============================================================
   SPINNER / MENSAJES
============================================================ */
var spinnerEl = document.getElementById('spinner'), spinnerTxt = document.getElementById('spinner-text'), msgEl = document.getElementById('msg');
function showSpinner(t) { spinnerTxt.textContent = t || 'Procesando…'; spinnerEl.classList.add('visible'); }
function hideSpinner() { spinnerEl.classList.remove('visible'); }
function setMsg(t, color) { msgEl.textContent = t || ''; msgEl.style.color = color || 'var(--nx-tinta)'; }
function clearMsg() { setMsg('', ''); }

function cerrarSesion() {
  if (confirm('¿Cerrar sesión?')) {
    sessionStorage.removeItem('sad_user');
    localStorage.removeItem('sad_user');
    window.location.replace('login.html');
  }
}

/* ============================================================
   BOTONERA — solo lo que este usuario tiene permitido
============================================================ */
function ic(d) { return '<span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg></span>'; }

var BOTONES = [
  { k: 'asignar', t: 'Pedidos asignados', sub: 'Tu ruta y los disponibles', href: 'asignar.html', fuerte: true,
    ic: '<path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="18" r="1.6"/><circle cx="17" cy="18" r="1.6"/>',
    ok: ES_ADMIN || ES_TRAV || ES_GRAN },
  { k: 'auto', t: 'Auto-Asignar', sub: 'Subir ticket con foto', href: 'auto.html', num: 'cola',
    ic: '<path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13.5" r="3.2"/>',
    ok: true },
  { k: 'dia', t: 'Pedidos %DIA', sub: 'Tienda online', href: 'dia.html', num: 'dia',
    ic: '<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2"/>',
    ok: true },
  { k: 'incidencias', t: 'Incidencias', sub: 'Abiertas y resueltas', href: 'incidencias.html', num: 'inc',
    ic: '<path d="M12 4l9 16H3zM12 10v4M12 17v.5"/>',
    ok: true },
  { k: 'reservas', t: 'Reservas', sub: 'Franjas y cupos', href: 'reservas.html?u=' + USR,
    ic: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',
    ok: ES_ADMIN || ES_TRAV },
  { k: 'informe', t: 'Informe', sub: 'Tus pedidos del período', href: 'informe-repartidor-nivel1.html',
    ic: '<path d="M5 20V10M12 20V4M19 20v-7"/>',
    ok: true },
  { k: 'flota', t: 'Flota', sub: 'Combustible y mantenimiento', href: 'flota.html',
    ic: '<path d="M4 20V5a2 2 0 0 1 2-2h5a2 2 0 0 1 2 2v15M3 20h12M6 7h5M16 9h3l1.5 2v7a1.5 1.5 0 0 1-3 0v-4h-1.5"/>',
    ok: true },
  { k: 'embolsado', t: 'Embolsado', sub: 'Leer tickets y preparar', href: EMBOLSADO_URL + '?u=' + USR, target: '_top',
    ic: '<path d="M6 8h12l1 12H5zM9 8V6a3 3 0 0 1 6 0v2"/>',
    ok: ES_ADMIN || ES_EMB },
  { k: 'actualizar', t: 'Actualizar pedidos', sub: 'Reconstruir el control de tickets', accion: 'nexoActualizarPedidos', ancho: true,
    ic: '<path d="M20 12a8 8 0 1 1-2.5-5.8M20 4v5h-5"/>',
    ok: ES_ADMIN },
  { k: 'config', t: 'Configuración', sub: 'Límites, informes y avisos', href: 'config.html?u=' + USR, ancho: true,
    ic: '<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>',
    ok: ES_ADMIN }
];

function pintarBotonera() {
  var html = '';
  BOTONES.filter(function (b) { return b.ok; }).forEach(function (b) {
    var clases = 'bot' + (b.fuerte ? ' fuerte' : '') + (b.ancho ? ' ancho' : '');
    var globo = b.num ? '<span class="num' + (b.num === 'inc' ? ' rojo' : '') + '" id="num_' + b.num + '" role="status"></span>' : '';
    var dentro = ic(b.ic) + '<span>' + b.t + '<span class="sub">' + b.sub + '</span></span>' + globo;
    if (b.accion) html += '<button type="button" class="' + clases + '" onclick="window.' + b.accion + '()">' + dentro + '</button>';
    else html += '<a class="' + clases + '" href="' + b.href + '"' + (b.target ? ' target="' + b.target + '"' : '') + '>' + dentro + '</a>';
  });
  document.getElementById('botonera').innerHTML = html;
}
pintarBotonera();

/* ============================================================
   GLOBOS — se copian de la barra (nexo-nav.js), sin pedir nada al servidor.
   Así el inicio no duplica las consultas de %DIA ni de Incidencias.
============================================================ */
function copiarGlobo(origenId, destinoId) {
  var o = document.getElementById(origenId), d = document.getElementById(destinoId);
  if (!o || !d) return;
  var txt = (o.textContent || '').trim();
  var hay = txt && txt !== '0' && o.style.display !== 'none';
  d.textContent = txt;
  d.classList.toggle('on', !!hay);
}
setInterval(function () { copiarGlobo('nxNumDia', 'num_dia'); copiarGlobo('nxNumInc', 'num_inc'); }, 1000);
setTimeout(function () { copiarGlobo('nxNumDia', 'num_dia'); copiarGlobo('nxNumInc', 'num_inc'); }, 1200);

/* Tickets que quedaron en la cola de Auto-Asignar (IndexedDB) sin subir. */
function contarCola() {
  try {
    var req = indexedDB.open('nexo-tickets-queue', 1);
    req.onsuccess = function (e) {
      var db = e.target.result;
      if (!db.objectStoreNames.contains('pendientes')) return;
      var tx = db.transaction('pendientes', 'readonly').objectStore('pendientes').count();
      tx.onsuccess = function () {
        var d = document.getElementById('num_cola');
        if (!d) return;
        d.textContent = String(tx.result || 0);
        d.classList.toggle('on', (tx.result || 0) > 0);
        if (tx.result > 0) setMsg('Hay ' + tx.result + ' ticket(s) sin subir en Auto-Asignar.', 'var(--nx-ambar)');
      };
    };
    req.onerror = function () {};
  } catch (e) {}
}
contarCola();
document.addEventListener('visibilitychange', function () { if (!document.hidden) contarCola(); });

/* Aviso en pantalla cuando llegan pedidos %DIA nuevos (lo dispara nexo-nav.js). */
document.addEventListener('nexo:dia-nuevo', function (ev) {
  setMsg((ev && ev.detail && ev.detail.texto) || 'Pedidos %DIA nuevos', 'var(--nx-ambar)');
  setTimeout(clearMsg, 8000);
});

/* ============================================================
   ACTUALIZAR PEDIDOS (solo ADM) — lo llama este botón y también la barra.
============================================================ */
window.nexoActualizarPedidos = async function () {
  if (!ES_ADMIN) return;
  if (!confirm('¿Actualizar los pedidos (reconstruir el control de tickets)? Puede tardar unos minutos.')) return;
  showSpinner('Actualizando pedidos…');
  try {
    var r = await postProxy(CONTROL_TICKETS_URL, { accion: 'actualizarManual', usuario: sesion.usuario || '' });
    if (r && r.ok) setMsg('Pedidos actualizados' + (r.periodos ? ' (' + r.periodos + ')' : ''), 'var(--nx-verde)');
    else setMsg((r && r.error) || 'No se pudo actualizar', 'var(--nx-rojo)');
  } catch (e) { setMsg('Error de conexión al actualizar: ' + (e && e.message ? e.message : e), 'var(--nx-rojo)'); }
  hideSpinner();
  setTimeout(clearMsg, 6000);
};

/* ============================================================
   Sesión antigua sin DEPARTAMENTO: se pregunta una vez y, si es de
   EMBOLSADO y no es ADM, se le manda a su página de inicio.
============================================================ */
(function () {
  if (!sesion || !sesion.usuario || typeof sesion.departamento !== 'undefined') return;
  postProxy(BACKEND_URL, { accion: 'verificarUsuario', usuario: sesion.usuario }).then(function (d) {
    if (!d || !d.encontrado || typeof d.departamento === 'undefined') return;
    sesion.departamento = String(d.departamento || '').toUpperCase().trim();
    try {
      sessionStorage.setItem('sad_user', JSON.stringify(sesion));
      var ls = JSON.parse(localStorage.getItem('sad_user') || 'null');
      if (ls && ls.usuario === sesion.usuario) { ls.departamento = sesion.departamento; localStorage.setItem('sad_user', JSON.stringify(ls)); }
    } catch (e) {}
    if (sesion.departamento === 'EMBOLSADO' && !ES_ADMIN) window.location.replace('inicio-embolsado.html');
  }).catch(function () {});
})();

/* Service worker (igual que antes). */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('service-worker.js').catch(function () {}); });
}
</script>
</body>
</html>
