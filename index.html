<!-- Nexo Tickets index.html — parche 2026-09-22:
     1) Reintento automático (hasta 3 intentos) cuando "Subir ticket" falla
        por un error transitorio de Google (página HTML en vez de JSON/texto).
     2) Distingue "YA_SUBIDO" (idempotencia del backend) de "OK" para que el
        repartidor sepa con certeza si el ticket se subió, sin duplicados.
     3) Si los reintentos rápidos se agotan, el ticket se guarda en la cola
        offline (IndexedDB) y se reintenta solo cada 30s en segundo plano,
        en vez de mostrar el HTML crudo de Google.
     Requiere el fix complementario en el backend (Code.gs, función
     procesarTicket) para la idempotencia — ver documentación del proyecto.

     Cambios 2026-10-02 (v2.11.0):
     1) El botón de Incidencias (⚠️) aparece para TODOS los usuarios; cada
        repartidor ve solo sus propias incidencias (filtro en el backend del
        Módulo Embolsado — requiere el Embolsado.gs del 2026-10-02).
     2) Fecha y Franja horaria ocupan la misma línea, para todos.
     3) Botones laterales apilados en una sola columna (para ADM se suman
        Embolsado, Actualizar pedidos y Configuración). Incidencias y Pedidos
        asignados siguen donde estaban.

     Cambios 2026-10-02 (v2.12.0):
     1) Los usuarios del departamento EMBOLSADO (columna DEPARTAMENTO de la
        hoja USUARIOS) no ven este index: se les envía a su página de inicio
        propia, inicio-embolsado.html (logo + Reservas / Incidencias /
        Embolsado / Informe). Los ADM siguen viendo este index aunque su
        departamento sea EMBOLSADO. El departamento llega en la sesión
        (login.html + main.gs de NEXO SCRIPT del 2026-10-02); si la sesión
        es anterior y no lo trae, se consulta una vez al backend.

     Cambios 2026-10-02 (v2.13.0):
     1) El botón %DIA está SIEMPRE visible (antes nacía oculto en cada carga
        y solo aparecía cuando respondía el servidor, así que al volver de
        dia.html desaparecía unos segundos — o un minuto entero si esa
        consulta fallaba).
     2) El contador amarillo se pinta al instante con el último número
        guardado (dia.html lo mantiene al día) y luego se confirma con el
        servidor. Repartidor: pedidos %DIA asignados a él y aún sin entregar.
        Gestores: pedidos %DIA sin asignar (como antes).
     3) Si la consulta falla, reintenta a los 4, 8 y 12 s en vez de esperar
        al minuto siguiente.

     Cambios 2026-10-09 (v3.10.1): los botones "Sacar foto" y "Galería" se
     sustituyen por el selector deslizante (nexo-foto.js), al lado de
     "Subir ticket". Comprobación de versión automática (nexo-version.js).
     Cambios 2026-10-08 (v2.14.0, ronda 24): diseño nuevo de Nexo
     (nexo-tema.css). Cabecera blanca con el logo oficial, usuario y Salir;
     los botones de módulos pasan a una cuadrícula de iconos encima del
     formulario (ADM ve además Embolsado, Actualizar y Config). La lógica
     del formulario y de la subida de tickets no cambia. 
     v3.10.2 (2026-10-09): ventana "Qué novedades hay" (nexo-novedades.js), una vez por usuario;
     se vuelve a abrir con el enlace de abajo.
-->

<script>
(function sessionGuard() {
  try {
    var raw = sessionStorage.getItem('sad_user');
    if (!raw) { window.location.replace('login.html'); return; }
    var u = JSON.parse(raw);
    if (!u || !u.usuario || !u.token) {
      sessionStorage.removeItem('sad_user');
      window.location.replace('login.html');
      return;
    }
    if (typeof u.tiendaPre === 'undefined') {
      sessionStorage.removeItem('sad_user');
      window.location.replace('login.html');
      return;
    }
    // Departamento EMBOLSADO (2026-10-02): tiene su propia página de inicio.
    // Los ADM se quedan en este index.
    if (String(u.departamento || '').toUpperCase().trim() === 'EMBOLSADO' &&
        String(u.nivel || '').toLowerCase().trim() !== 'admin') {
      window.location.replace('inicio-embolsado.html');
    }
  } catch(e) {
    sessionStorage.removeItem('sad_user');
    window.location.replace('login.html');
  }
})();
</script>

<!-- PROXY FETCH -->
<script>
(function installProxy() {
  var _fetch = window.fetch;
  var BACKEND = "https://script.google.com/macros/s/AKfycbzkf4K28coJa5YXNv_iN08sfhjrtKenyFJgHxWaIxMGVtuABHswvySAFEmowq5vP4rD/exec";
  var PROXY   = "https://sad-proxy.colatino-ventas-enlinea.workers.dev/";
  window.BACKEND_URL = BACKEND;
  window.fetch = function(input, init) {
    init = init || {};
    try {
      var url = (typeof input === "string") ? input : (input && input.url ? input.url : "");
      if (url === BACKEND) {
        var proxied = PROXY + "?url=" + encodeURIComponent(BACKEND);
        return _fetch(proxied, init);
      }
    } catch(e) {}
    return _fetch(input, init);
  };
})();
</script>

<script>
/* ============================================================
   REFERENCIAS DOM
============================================================ */
const msgEl       = document.getElementById('msg');
const spinnerEl   = document.getElementById('spinner');
const spinnerTxt  = document.getElementById('spinner-text');
const fotoInput   = document.getElementById('foto');
const fotoPreview = document.getElementById('fotoPreview');
const fotoInfo    = document.getElementById('fotoInfo');
const fechaInput  = document.getElementById('fecha');
const repartSel   = document.getElementById('repartidor');
const tiendaSel   = document.getElementById('tienda');

/* ============================================================
   SESIÓN — niveles: admin / usuario 1 / usuario 2
============================================================ */
let sesion = null;
try { sesion = JSON.parse(sessionStorage.getItem('sad_user')); } catch(e) {}

const NIVEL        = (sesion && sesion.nivel ? String(sesion.nivel).toLowerCase().trim() : 'usuario 1');
const ES_ADMIN     = NIVEL === 'admin';
const ES_USUARIO_1 = NIVEL === 'usuario 1' || NIVEL === 'usuario1';
const ES_USUARIO_2 = NIVEL === 'usuario 2' || NIVEL === 'usuario2';
const ES_USUARIO_3 = NIVEL === 'usuario 3' || NIVEL === 'usuario3';

document.getElementById('badgeNombre').textContent = sesion?.nombre || '—';
const nivelTag = document.getElementById('nivelTag');
nivelTag.textContent = NIVEL;
if (ES_ADMIN) nivelTag.classList.add('admin');

/* ===== Botones de ADM + aviso de incidencias ===== */
var EMBOLSADO_URL = 'https://script.google.com/macros/s/AKfycbxvyzpNQObvloq0tuoDisEn4qrGWh0tEGfGHn4NXoEqP1ShODyIWQ1bzYyWfcuz_Pqh/exec';
var CONTROL_TICKETS_URL = 'https://script.google.com/macros/s/AKfycbzEnq5PYv_9pAi-d-dRi-M69rxPxW62Qd3vy61qvGxR9s-YxgkYdWlZ7b2alJrXAt1sYg/exec';
var PROXY_BASE = 'https://sad-proxy.colatino-ventas-enlinea.workers.dev/';
function postProxy(url, body) {
  return fetch(PROXY_BASE + '?url=' + encodeURIComponent(url), {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
  }).then(function (r) {
    return r.text().then(function (t) {
      try { return JSON.parse(t); }
      catch (e) { return { ok: false, error: 'Respuesta inesperada (' + r.status + '): ' + t.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 140) }; }
    });
  });
}
/* Ronda 27: el menú antiguo de módulos desapareció (era redundante con la barra de accesos).
   «Actualizar» pasa a la barra (solo ADM, en esta página): nexo-nav.js llama a esta función. */
window.nexoActualizarPedidos = async function () {
  if (!ES_ADMIN) return;
  if (!confirm('¿Actualizar los pedidos (reconstruir el control de tickets)? Puede tardar unos minutos.')) return;
  showSpinner('Actualizando pedidos…');
  try {
    var r = await postProxy(CONTROL_TICKETS_URL, { accion: 'actualizarManual', usuario: (sesion && sesion.usuario) || '' });
    if (r && r.ok) setMsg('✅ Pedidos actualizados' + (r.periodos ? ' (' + r.periodos + ')' : ''), '#9dffb0');
    else setMsg('❌ ' + ((r && r.error) || 'No se pudo actualizar'), '#ff6b6b');
  } catch (e) { setMsg('❌ Error de conexión al actualizar: ' + (e && e.message ? e.message : e), '#ff6b6b'); }
  hideSpinner();
  setTimeout(clearMsg, 6000);
};
/* Departamento EMBOLSADO (2026-10-02): si la sesión es anterior a este cambio
   (o se entró con un login.html viejo en caché) no trae el departamento. Se
   consulta UNA vez al backend, se guarda en la sesión y, si el usuario es de
   EMBOLSADO y no es ADM, se le envía a su página de inicio. Si el backend
   todavía no devuelve el departamento (main.gs sin actualizar), no pasa nada:
   se queda en este index como hasta ahora. */
(function () {
  if (!sesion || !sesion.usuario || typeof sesion.departamento !== 'undefined') return;
  postProxy(window.BACKEND_URL, { accion: 'verificarUsuario', usuario: sesion.usuario }).then(function (d) {
    if (!d || !d.encontrado || typeof d.departamento === 'undefined') return;
    sesion.departamento = String(d.departamento || '').toUpperCase().trim();
    try {
      sessionStorage.setItem('sad_user', JSON.stringify(sesion));
      var ls = JSON.parse(localStorage.getItem('sad_user') || 'null');
      if (ls && ls.usuario === sesion.usuario) {
        ls.departamento = sesion.departamento;
        localStorage.setItem('sad_user', JSON.stringify(ls));
      }
    } catch (e) {}
    if (sesion.departamento === 'EMBOLSADO' && !ES_ADMIN) window.location.replace('inicio-embolsado.html');
  }).catch(function () {});
})();

/* Ronda 27: los globos de %DIA e Incidencias (contadores, vibración y notificación) viven ahora en
   nexo-nav.js. Aquí solo se muestra el aviso en pantalla cuando llegan pedidos %DIA nuevos. */
document.addEventListener('nexo:dia-nuevo', function (ev) {
  setMsg('🔔 ' + (ev && ev.detail && ev.detail.texto || 'Pedidos %DIA nuevos'), '#facc15'); setTimeout(clearMsg, 8000);
});

function cerrarSesion() {

    sessionStorage.removeItem('sad_user');
    localStorage.removeItem('sad_user');
    window.location.replace('login.html');
  }
}

function showSpinner(t) { spinnerTxt.textContent = t || 'Procesando…'; spinnerEl.classList.add('visible'); }
function hideSpinner()  { spinnerEl.classList.remove('visible'); }

function setMsg(text, color) {

  msgEl.textContent = text;
  var tipo = !color ? 'info' : color === '#9dffb0' ? 'ok' : (color === '#ffcc00' || color === '#facc15') ? 'ambar' : 'error';
  msgEl.className = text ? 'nx-aviso ' + tipo : '';
  msgEl.style.opacity = '1';
}
function clearMsg() {
  msgEl.style.transition = 'opacity .5s';
  msgEl.style.opacity = '0';
  setTimeout(() => { msgEl.textContent = ''; msgEl.className = ''; }, 520);
}
function showOfflineAlert() {

  setTimeout(() => el.style.display = 'none', 4000);

/* ============================================================
   FECHA POR DEFECTO Y BLOQUEO
============================================================ */
// OJO: toISOString() siempre da la fecha en UTC, no en hora local. En España
// (UTC+1 invierno / UTC+2 verano) eso hacía que, durante la madrugada
// (00:00-02:00 hora local aprox.), la fecha calculada fuera la de AYER en
// vez de la de hoy — y como el campo queda bloqueado para usuario 1/usuario 3,
// no había forma de corregirlo a mano. Fix 2026-09-22: calcular la fecha con
// los componentes LOCALES del navegador (getFullYear/getMonth/getDate),
// nunca con toISOString().
function fechaLocalISO(d) {
  const y   = d.getFullYear();
  const m   = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}

/* ============================================================
   FRANJA HORARIA — según la tienda elegida y la hora actual
   Regla: se puede elegir una franja hasta 1 hora antes de que acabe.
   Si la tienda solo tiene UNA franja (p.ej. "ONLINE" 10-22H), el corte
   es justo en su hora de fin — hay que estar dentro del tramo.
   El corte por hora solo se aplica a usuario 1 y usuario 2;
   admin y usuario 3 ven todas las franjas de la tienda sin filtrar por hora.
============================================================ */
function parseFranja(str) {
  const m = /^(\d{1,2})-(\d{1,2})H$/i.exec(String(str).trim());
  if (!m) return null;
  return { inicio: parseInt(m[1], 10) * 60, fin: parseInt(m[2], 10) * 60 };
}

function getFranjasPermitidas(listaFranjas) {
  const ahora = new Date();
  const mins  = ahora.getHours() * 60 + ahora.getMinutes();
  const esTramoUnico = listaFranjas.length === 1;
  return listaFranjas.filter(f => {
    const p = parseFranja(f);
    if (!p) return true; // formato no reconocido: no bloquear por seguridad
    const limite = esTramoUnico ? p.fin : (p.fin - 60);
    return mins <= limite;
  });
}

function aplicarReglasFranja() {
  const franjaSel   = document.getElementById('franja');
  const tienda      = tiendaSel.value;
  const listaTienda = TIENDAS_FRANJAS[tienda] || [];

  if (!tienda || listaTienda.length === 0) {
    fillSelect('franja', [], 'Franja…');
    franjaSel.disabled = false;
    franjaSel.classList.remove('locked');
    return;
  }

  const conFiltroHora = ES_USUARIO_1 || ES_USUARIO_2;
  const permitidas    = conFiltroHora ? getFranjasPermitidas(listaTienda) : listaTienda;

  const seleccionActual = franjaSel.value;
  fillSelect('franja', permitidas, 'Franja…');

  if (permitidas.length === 0) {
    setMsg('⚠️ Fuera del horario disponible para esta tienda', '#ffcc00');
  } else if (permitidas.includes(seleccionActual)) {
    franjaSel.value = seleccionActual;
  } else {
    franjaSel.value = permitidas[0];
  }

  if (permitidas.length === 1) {
    franjaSel.disabled = true;
    franjaSel.classList.add('locked');
  } else {
    franjaSel.disabled = false;
    franjaSel.classList.remove('locked');
  }
}

/* ============================================================
   OPTIMIZACIÓN DE FOTO — EN COLOR, SIN FILTROS, SIN RECORTE

   ✅ FIX BUG 2: casos 6, 7 y 8 del switch EXIF corregidos.
   El error original era que visW y visH estaban intercambiados
   como parámetros de traslación en esos tres casos, haciendo
   que la imagen se dibujase parcialmente fuera del canvas y
   apareciera una franja blanca en el JPEG resultante.

   Para orientaciones 5-8 (fotos con ejes intercambiados):
     visW = img.naturalHeight  (dimension larga → nuevo ancho)
     visH = img.naturalWidth   (dimension corta → nuevo alto)

   Transforms correctos (canvas.translate + canvas.rotate en forma matricial):
     case 6 (+90° CW): translate(visW, 0)    → transform(0,1,-1,0,visW,0)
     case 7 (−90°+HF): translate(visW, visH) → transform(0,-1,-1,0,visW,visH)
     case 8 (−90° CW): translate(0, visH)    → transform(0,-1,1,0,0,visH)
============================================================ */
function getExifOrientation(dataURL) {
  try {
    const b64 = dataURL.split(',')[1];
    const bin = atob(b64);
    const buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    const dv = new DataView(buf.buffer);
    if (dv.getUint16(0) !== 0xFFD8) return 1;
    let offset = 2;
    while (offset < dv.byteLength - 2) {
      const marker = dv.getUint16(offset);
      const len    = dv.getUint16(offset + 2);
      if (marker === 0xFFE1) {
        if (dv.getUint32(offset + 4) === 0x45786966 && dv.getUint16(offset + 8) === 0x0000) {
          const tiff = offset + 10;
          const le   = dv.getUint16(tiff) === 0x4949;
          const ifd  = dv.getUint32(tiff + 4, le);
          const n    = dv.getUint16(tiff + ifd, le);
          for (let i = 0; i < n; i++) {
            const tag = dv.getUint16(tiff + ifd + 2 + i * 12, le);
            if (tag === 0x0112) return dv.getUint16(tiff + ifd + 2 + i * 12 + 8, le);
          }
        }
        return 1;
      }
      if ((marker & 0xFF00) !== 0xFF00) return 1;
      offset += 2 + len;
    }
  } catch(e) {}
  return 1;
}

function optimizarFoto(file, rotacionExtra) {
  rotacionExtra = rotacionExtra || 0;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('No se pudo leer la imagen'));
    reader.onload  = function(ev) {
      const dataURL = ev.target.result;
      const img     = new Image();
      img.onerror   = () => reject(new Error('Imagen no válida'));
      img.onload    = function() {
        try {
          const orientation = getExifOrientation(dataURL);

          /* Paso 1: canvas con corrección EXIF → imagen en orientación visual correcta */
          const swapExif = [5, 6, 7, 8].includes(orientation);
          const visW = swapExif ? img.naturalHeight : img.naturalWidth;
          const visH = swapExif ? img.naturalWidth  : img.naturalHeight;

          const c1   = document.createElement('canvas');
          c1.width   = visW;
          c1.height  = visH;
          const ctx1 = c1.getContext('2d');
          ctx1.save();

          switch (orientation) {
            case 2: ctx1.transform(-1, 0, 0,  1, visW, 0);    break; // flip H
            case 3: ctx1.transform(-1, 0, 0, -1, visW, visH); break; // rot 180°
            case 4: ctx1.transform( 1, 0, 0, -1, 0,    visH); break; // flip V
            case 5: ctx1.transform( 0, 1, 1,  0, 0,    0);    break; // transponer
            // ✅ FIXED: los 3 casos siguientes usaban visH donde va visW y viceversa
            case 6: ctx1.transform( 0, 1,-1,  0, visW, 0);    break; // +90° CW
            case 7: ctx1.transform( 0,-1,-1,  0, visW, visH); break; // −90° + flip H
            case 8: ctx1.transform( 0,-1, 1,  0, 0,    visH); break; // −90° CW
            default: break;
          }
          ctx1.drawImage(img, 0, 0);
          ctx1.restore();

          /* Paso 2: rotación manual adicional (0 / 90 / 180 / 270) */
          const swap2  = rotacionExtra === 90 || rotacionExtra === 270;
          const finalW = swap2 ? visH : visW;
          const finalH = swap2 ? visW : visH;

          const MAX   = 1800;
          const scale = Math.min(MAX / Math.max(finalW, finalH), 1);
          const dstW  = Math.round(finalW * scale);
          const dstH  = Math.round(finalH * scale);

          const c2   = document.createElement('canvas');
          c2.width   = dstW;
          c2.height  = dstH;
          const ctx2 = c2.getContext('2d');

          // Fondo blanco (necesario para JPEG; invisible si la imagen llena el canvas)
          ctx2.fillStyle = '#fff';
          ctx2.fillRect(0, 0, dstW, dstH);

          ctx2.save();
          ctx2.translate(dstW / 2, dstH / 2);
          ctx2.rotate(rotacionExtra * Math.PI / 180);

          const sw = Math.round(visW * scale);
          const sh = Math.round(visH * scale);
          ctx2.drawImage(c1, -sw / 2, -sh / 2, sw, sh);
          ctx2.restore();

          /* Exportar EN COLOR, JPG calidad 0.82 */
          c2.toBlob(blob => {
            if (!blob) return reject(new Error('Error al exportar'));
            resolve(new File([blob], 'ticket.jpg', { type: 'image/jpeg' }));
          }, 'image/jpeg', 0.82);

        } catch(err) { reject(err); }
      };
      img.src = dataURL;
    };
    reader.readAsDataURL(file);
  });
}

============================================================ */
const DB_NAME    = 'nexo-tickets-queue';
const DB_VERSION = 1;
const STORE_NAME = 'pendientes';

function abrirDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
      }
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror   = e => reject(e.target.error);
  });
}

async function guardarEnCola(datos) {
  const db    = await abrirDB();
  const tx    = db.transaction(STORE_NAME, 'readwrite');
  const store = tx.objectStore(STORE_NAME);
  const item  = { ...datos, _ts: Date.now(), _intentos: 0 };
  return new Promise((resolve, reject) => {
    const req = store.add(item);
    req.onsuccess = () => resolve(req.result);
    req.onerror   = e  => reject(e.target.error);
  });
}

async function obtenerPendientes() {
  const db    = await abrirDB();
  const tx    = db.transaction(STORE_NAME, 'readonly');
  const store = tx.objectStore(STORE_NAME);
  return new Promise((resolve, reject) => {
    const req = store.getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror   = e  => reject(e.target.error);
  });
}

async function eliminarDeCola(id) {
  const db    = await abrirDB();
  const tx    = db.transaction(STORE_NAME, 'readwrite');
  const store = tx.objectStore(STORE_NAME);
  return new Promise((resolve, reject) => {
    const req = store.delete(id);
    req.onsuccess = () => resolve();
    req.onerror   = e  => reject(e.target.error);
  });
}

async function incrementarIntentos(id) {
  const db    = await abrirDB();
  const tx    = db.transaction(STORE_NAME, 'readwrite');
  const store = tx.objectStore(STORE_NAME);
  return new Promise((resolve, reject) => {
    const getReq = store.get(id);
    getReq.onsuccess = () => {
      const item = getReq.result;
      if (!item) return resolve();
      item._intentos = (item._intentos || 0) + 1;
      const putReq = store.put(item);
      putReq.onsuccess = () => resolve();
      putReq.onerror   = e => reject(e.target.error);
    };
    getReq.onerror = e => reject(e.target.error);
  });
}

async function contarPendientes() {
  const db    = await abrirDB();
  const tx    = db.transaction(STORE_NAME, 'readonly');
  const store = tx.objectStore(STORE_NAME);
  return new Promise((resolve, reject) => {
    const req = store.count();
    req.onsuccess = () => resolve(req.result);
    req.onerror   = ()  => resolve(0);
  });
}

async function actualizarBadgePendientes() {
  try {
    const n = await contarPendientes();

  } catch(e) {}
}

// Un fallo "transitorio" es un problema de red/infraestructura de Google
// (por ejemplo Apps Script devolviendo una página de error HTML en vez del
// texto esperado) — vale la pena reintentarlo. Un error real de la app
// (ej. "ERROR: imagen vacía") es determinístico y reintentarlo no ayuda.
function esFalloTransitorio(resp, text) {
  return !resp.ok || /^\s*<!DOCTYPE|^\s*<html/i.test(text || '');
}

async function enviarTicketDeCola(item) {
  const { id, ...datos } = item;
  const resp = await fetch(window.BACKEND_URL, {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify(datos)
  });
  const text = await resp.text();
  if (esFalloTransitorio(resp, text)) throw new Error(text || ('HTTP ' + resp.status));
  if (text.startsWith('ERROR:')) throw Object.assign(new Error(text), { noReintentar: true });
  return text; // 'OK | ...' o 'YA_SUBIDO | ...'
}

let _procesandoCola = false;

async function procesarCola(mostrarMsg) {
  if (_procesandoCola || !navigator.onLine) return;
  _procesandoCola = true;
  try {
    const pendientes = await obtenerPendientes();
    if (pendientes.length === 0) { _procesandoCola = false; return; }
    if (mostrarMsg) setMsg(`⏳ Subiendo ${pendientes.length} ticket(s) pendiente(s)...`, '#ffcc00');
    let ok = 0, fail = 0;
    for (const item of pendientes) {
      // Un ticket que ya falló muchas veces se descarta para no reintentarlo
      // para siempre (protección ante un payload realmente inválido).
      if ((item._intentos || 0) >= 20) {
        console.warn('[Nexo] Cola: descartando item tras 20 intentos', item.id);
        await eliminarDeCola(item.id);
        continue;
      }
      try {
        await enviarTicketDeCola(item);
        await eliminarDeCola(item.id);
        ok++;
      } catch(e) {
        console.warn('[Nexo] Cola: fallo en item', item.id, e.message);
        if (e.noReintentar) {
          await eliminarDeCola(item.id); // error real de la app, no tiene sentido guardarlo
        } else {
          await incrementarIntentos(item.id);
          fail++;
        }
      }
    }
    await actualizarBadgePendientes();
    if (ok > 0) {
      setMsg(`✅ ${ok} ticket(s) pendiente(s) subido(s) correctamente`, '#9dffb0');
      setTimeout(clearMsg, 4000);
    } else if (mostrarMsg && fail > 0) {
      setMsg(`⚠️ Seguimos intentando subir ${fail} ticket(s) pendiente(s)...`, '#ffcc00');
    }
  } catch(e) {
    console.error('[Nexo] procesarCola:', e);
  }
  _procesandoCola = false;
}

window.addEventListener('online', () => {
  console.log('[Nexo] Conexión recuperada — procesando cola');
  setTimeout(() => procesarCola(true), 1500);
});

// Reintento periódico en segundo plano: cubre fallos intermitentes de Google
// aunque el teléfono siga "online" todo el tiempo (no solo al recuperar
// señal). Silencioso salvo cuando algo termina de subirse.
setInterval(() => procesarCola(false), 30000);

window.addEventListener('load', async () => {
  await actualizarBadgePendientes();
  if (navigator.onLine) {
    const n = await contarPendientes();
    if (n > 0) setTimeout(() => procesarCola(true), 2000);
  }
});

/* ============================================================
   ENVÍO DEL TICKET
============================================================ */
let _submitting = false;

/**
 * Envía el ticket reintentando automáticamente cuando el fallo parece ser
 * un problema transitorio de Google (ej. Apps Script devolviendo una página
 * de error HTML en vez del texto esperado — ver esFalloTransitorio). Un
 * error real de la app (ERROR: ...) se corta al primer intento.
 */
async function enviarTicketConReintentos(payload, intentos = 3, esperaBaseMs = 1500) {
  let ultimoError;
  for (let i = 0; i < intentos; i++) {
    try {
      const resp = await fetch(window.BACKEND_URL, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify(payload)
      });
      const text = await resp.text();

      if (esFalloTransitorio(resp, text)) {
        throw new Error(text || ('HTTP ' + resp.status));
      }
      if (text.startsWith('ERROR:')) {
        throw Object.assign(new Error(text), { noReintentar: true });
      }
      return text; // 'OK | ...' o 'YA_SUBIDO | ...'
    } catch(err) {
      if (err.noReintentar) throw err;
      ultimoError = err;
      if (i < intentos - 1) {
        showSpinner(`Subiendo ticket... reintentando (${i + 2}/${intentos})`);
        await new Promise(r => setTimeout(r, esperaBaseMs * (i + 1)));
      }
    }
  }
  throw ultimoError;
}

document.getElementById('ticketForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  if (_submitting) return;

  const foto = fotoInput.files[0];
  if (!foto) { alert('Por favor, selecciona una foto del ticket.'); return; }

  // Forzar fecha de hoy para usuario 1 y usuario 2
  if (!ES_ADMIN) fechaInput.value = HOY;

  // Forzar repartidor para usuario 1
  if (ES_USUARIO_1 && sesion) {
    const miNombre = sesion.nombre || sesion.usuario;
    const opciones = Array.from(repartSel.options).map(o => o.value);
    const match    = opciones.find(o => o.toLowerCase().trim() === miNombre.toLowerCase().trim());
    repartSel.value = match || miNombre;
  }

  // Validar campos obligatorios (sin espacios en blanco)
  const campos = ['fecha', 'tienda', 'repartidor', 'franja', 'pedidos'];
  for (const c of campos) {
    if (!String(document.getElementById(c).value || '').trim()) {
      alert(c === 'repartidor'
        ? 'Falta el nombre del REPARTIDOR. No se puede subir el ticket sin repartidor.'
        : c === 'tienda'
          ? 'Falta la TIENDA. Selecciónala antes de subir el ticket.'
          : 'Por favor, completa todos los campos obligatorios.');
      return;
    }
  }

  // FIX 2026-09-29: "congelar" los datos del formulario AHORA, antes de
  // procesar la foto. Antes se leían después (tras varios segundos de
  // compresión) y, si en ese intervalo se refrescaban las listas, el
  // ticket se enviaba con tienda/repartidor vacíos.
  const datosForm = {
    fecha:      fechaInput.value,
    tienda:     String(tiendaSel.value).trim(),
    repartidor: String(repartSel.value).trim(),
    franja:     String(document.getElementById('franja').value).trim(),
    pedidos:    document.getElementById('pedidos').value,
    dobles:     document.getElementById('dobles').value,
    xr:         document.getElementById('xr').value,
    km:         document.getElementById('km').value,
    obs:        document.getElementById('obs').value
  };

  // Revalidar que la franja elegida sigue disponible (por si pasó tiempo
  // con la pestaña abierta y ya cruzó el corte de "1h antes de caducar")
  if (ES_USUARIO_1 || ES_USUARIO_2) {
    const tiendaActual    = document.getElementById('tienda').value;
    const listaTienda     = TIENDAS_FRANJAS[tiendaActual] || [];
    const permitidasAhora = getFranjasPermitidas(listaTienda);
    const franjaElegida   = document.getElementById('franja').value;
    if (!permitidasAhora.includes(franjaElegida)) {
      alert('La franja horaria seleccionada ya no está disponible. Elige otra, por favor.');
      aplicarReglasFranja();
      return;
    }
  }

  _submitting = true;
  showSpinner('Procesando foto…');
  setMsg('', '');

  try {
    // Preparar foto
    let fotoOpt;
    if (fotoInput._procesada) {
      fotoOpt = fotoInput._procesada;
    } else {
      try {
        fotoOpt = await optimizarFoto(foto, rotacionManual);
      } catch(optErr) {
        console.warn('[Nexo] Optimización falló, usando original:', optErr);
        fotoOpt = foto;
      }
    }

    showSpinner('Subiendo ticket…');

    // Convertir a base64
    const base64 = await new Promise((res, rej) => {
      const r = new FileReader();
      r.onerror = () => rej(new Error('Error leyendo foto'));
      r.onload  = ev => res(ev.target.result);
      r.readAsDataURL(fotoOpt);
    });

    const payload = {
      ...datosForm,
      imagenBase64:  base64,
      usuarioSesion: sesion?.usuario || '',
      nivelSesion:   NIVEL
    };

    // Última barrera: nunca enviar ni guardar en cola un ticket sin repartidor/tienda
    if (!payload.repartidor || !payload.tienda) {
      throw Object.assign(new Error('Falta la tienda o el repartidor. Revisa el formulario.'), { noReintentar: true });
    }

    if (!navigator.onLine) {
      await guardarEnCola(payload);
      await actualizarBadgePendientes();
      setMsg('📥 Sin conexión — ticket guardado, se subirá al recuperar red', '#ffcc00');
      resetFormulario();
      showOfflineAlert();
      return;
    }

    // Envío online — con reintentos automáticos ante fallos intermitentes
    // de Google Apps Script (ver enviarTicketConReintentos más arriba).
    const text = await enviarTicketConReintentos(payload);

    if (text.startsWith('YA_SUBIDO')) {
      setMsg('✅ Este ticket ya estaba subido — no hace falta subirlo de nuevo', '#9dffb0');
    } else {
      setMsg('✅ Ticket subido correctamente', '#9dffb0');
    }
    setTimeout(clearMsg, 5000);
    resetFormulario();

  } catch(err) {
    console.error('[Nexo] submit:', err);

    if (err.noReintentar) {
      // Error real de la app (ej. imagen vacía) — reintentar no ayuda, se avisa directo
      setMsg('❌ Error: ' + err.message, '#ff6b6b');
    } else {
      // Sin conexión, o fallo intermitente de Google tras varios reintentos:
      // el ticket NO se pierde — se guarda y se reintenta solo en segundo
      // plano (cada 30s y al volver la conexión). El backend es idempotente:
      // si este ticket ya se había subido en un intento anterior, no se
      // duplica el archivo en Drive, así que reintentarlo es seguro.
      try {
        await guardarEnCola(payload);
        await actualizarBadgePendientes();
        setMsg('⏳ Problema de conexión con el servidor — el ticket quedó guardado y se subirá solo (no hace falta repetirlo)', '#ffcc00');
        resetFormulario();
      } catch(qErr) {
        setMsg('❌ Error: ' + err.message, '#ff6b6b');
      }
    }
  } finally {
    hideSpinner();
    _submitting = false;
  }
});


/* ============================================================
   MÓDULO EMBOLSADO — botón ASIGNAR PEDIDOS (solo tienda TRAVESIA)
   Si no se usa el botón, el formulario funciona exactamente como antes.
============================================================ */
const btnAsignar = document.getElementById('btnAsignar');
const asigHint   = document.getElementById('asigHint');
function esTravesia(v) { return /trav[eé]s[ií]a/i.test(String(v || '')); }
function actualizarBtnAsignar() {
  btnAsignar.style.display = esTravesia(tiendaSel.value) ? 'block' : 'none';
}
tiendaSel.addEventListener('change', actualizarBtnAsignar);
(function () {
  var _art = aplicarReglasTienda;
  aplicarReglasTienda = function () { _art.apply(this, arguments); actualizarBtnAsignar(); };
})();
function aplicarPedidosAsignados() {
  var n = 0;
  try { n = parseInt(sessionStorage.getItem('nexo_asignados') || '0', 10) || 0; } catch (e) {}
  var p = document.getElementById('pedidos');
  if (n > 0) {
    p.value = String(n);
    p.readOnly = true;
    asigHint.innerHTML = '🔒 ' + n + ' pedido(s) asignados a tu ruta <a id="asigQuitar">quitar</a>';
    asigHint.style.display = 'block';
    document.getElementById('asigQuitar').onclick = function () { liberarPedidosAsignados(); p.value = '0'; };
  } else { liberarPedidosAsignados(); }
}
function liberarPedidosAsignados() {
  try { sessionStorage.removeItem('nexo_asignados'); } catch (e) {}
  var p = document.getElementById('pedidos');
  p.readOnly = false;
  asigHint.style.display = 'none';
  asigHint.textContent = '';
}
actualizarBtnAsignar();
aplicarPedidosAsignados();

/* ============================================================
   RESET FORMULARIO
============================================================ */
function resetFormulario() {
  borrarEstadoForm();
  liberarPedidosAsignados();
  fotoInput.value      = '';
  fotoInput._procesada = null;
  fotoPreview.style.display = 'none';
  fotoPreview.src      = '';
  fotoInfo.style.display = 'none';
  fotoInfo.textContent = '';
  document.getElementById('btnGirar').style.display = 'none';
  rotacionManual = 0;

  document.getElementById('pedidos').value = '0';
  document.getElementById('dobles').value  = '0';
  document.getElementById('xr').value      = '0';
  document.getElementById('km').value      = '0';
  document.getElementById('obs').value     = '';

  if (ES_ADMIN) {
    document.getElementById('tienda').selectedIndex = 0;
    repartSel.selectedIndex = 0;
    document.getElementById('franja').selectedIndex = 0;
    actualizarBtnAsignar();
  } else {
    aplicarReglasTienda();
    if (ES_USUARIO_1) aplicarReglasRepartidor();
    aplicarReglasFranja();
  }
}
