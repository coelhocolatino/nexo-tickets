<!DOCTYPE html>
<!-- Nexo Tickets index.html — parche 2026-09-22:
     1) Reintento automático (hasta 3 intentos) cuando "Subir ticket" falla
        por un error transitorio de Google (página HTML en vez de JSON/texto).
     2) Distingue "YA_SUBIDO" (idempotencia del backend) de "OK" para que el
        repartidor sepa con certeza si el ticket se subió, sin duplicados.
     3) Si los reintentos rápidos se agotan, el ticket se guarda en la cola
        offline (IndexedDB) y se reintenta solo cada 30s en segundo plano,
        en vez de mostrar el HTML crudo de Google.
     Requiere el fix complementario en el backend (Code.gs, función
     procesarTicket) para la idempotencia — ver documentación del proyecto. -->
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#003366" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Nexo Tickets" />
<meta name="display" content="standalone" />
<link rel="manifest" href="manifest.json?v=5">
<link rel="icon" href="nexo-icon-192.png">
<link rel="apple-touch-icon" href="nexo-icon-192.png">
<title>Nexo · SAD Tickets</title>
<style>
:root {
  --bg1:#003366; --bg2:#0077cc;
  --card-bg:rgba(255,255,255,.12);
  --text-main:#fff; --text-dark:#003366;
  --radius-card:24px; --radius-field:12px;
  --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", sans-serif;
}
*, *::before, *::after { box-sizing:border-box; -webkit-font-smoothing:antialiased; font-family:var(--font); }
body {
  margin:0; min-height:100vh;
  background:linear-gradient(180deg, var(--bg1), var(--bg2));
  color:var(--text-main);
  display:flex; justify-content:center; align-items:flex-start;
  padding:24px 16px 56px;
}
.card {
  width:100%; max-width:420px;
  background:var(--card-bg);
  border-radius:var(--radius-card);
  box-shadow:0 16px 40px rgba(0,0,0,.45);
  padding:20px 16px 28px;
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
}
.header { text-align:center; margin-bottom:18px; position:relative; }
.btn-reservas {
  position:absolute; top:-4px; right:-2px;
  display:block; width:38px; height:38px;
  border-radius:10px; overflow:hidden;
  box-shadow:0 4px 14px rgba(0,0,0,.35);
  transition:transform .12s;
}
.btn-reservas:active { transform:scale(.93); }
.btn-reservas img { width:100%; height:100%; display:block; object-fit:cover; }
.logo {
  width:170px; max-width:65%;
  height:auto; display:block;
  margin:0 auto 10px auto;
  background:#fff;
  border-radius:14px;
  padding:8px 14px;
}
.user-badge {
  display:inline-flex; align-items:center; gap:6px;
  background:rgba(255,255,255,.15);
  border:1px solid rgba(255,255,255,.2);
  border-radius:20px;
  padding:5px 14px 5px 10px;
  font-size:.8rem; font-weight:700;
  color:rgba(255,255,255,.92);
  margin-bottom:6px; cursor:pointer;
  transition:background .18s;
}
.user-badge:hover { background:rgba(255,255,255,.23); }
.nivel-tag {
  display:inline-block;
  background:rgba(96,165,250,.25);
  color:#bfdbfe;
  padding:2px 8px;
  border-radius:10px;
  font-size:.65rem;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.05em;
  margin-left:6px;
}
.nivel-tag.admin { background:rgba(251,146,60,.25); color:#fed7aa; }
.app-version { font-size:.78rem; font-weight:600; color:rgba(255,255,255,.45); }
form { display:flex; flex-direction:column; gap:12px; }
label {
  font-size:.88rem; font-weight:600;
  color:var(--text-main);
  margin-bottom:3px; display:block;
}
.control {
  width:100%; border:none; border-radius:var(--radius-field);
  background:#fff; color:var(--text-dark);
  font-weight:500; padding:13px 12px;
  font-size: max(1rem, 16px);
  outline:none;
}
select.control { -webkit-appearance:none; appearance:none; }
.control.locked, .control:disabled {
  background:#e5e7eb !important;
  color:#475569 !important;
  cursor:not-allowed !important;
  opacity:1;
}
.lock-hint {
  font-size:.7rem;
  color:rgba(255,255,255,.6);
  font-style:italic;
  margin-top:-8px;
  display:flex; align-items:center; gap:4px;
}
.row-2 { display:flex; gap:12px; }
.row-2 .group { flex:1; min-width:0; }
.row-3 { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.row-3 .group label { font-size:.82rem; text-align:center; }
.row-3 .control { text-align:center; padding:12px 4px; }
button {
  width:100%; border:none;
  border-radius:var(--radius-field);
  background:#fff; color:var(--text-dark);
  font-weight:700; padding:15px 14px;
  font-size: max(1rem, 16px);
  cursor:pointer;
  box-shadow:0 8px 22px rgba(0,0,0,.38);
  transition:transform .12s, box-shadow .18s;
}
button:active { transform:scale(.97); }
.btn-foto-wrap { display:flex; gap:10px; }
.btn-foto-wrap button { flex:1; }
#fotoPreview {
  width:100%; border-radius:12px;
  max-height:220px; object-fit:contain;
  display:none;
  border:2px solid rgba(255,255,255,.3);
  background:rgba(0,0,0,.2);
}
#fotoInfo {
  font-size:.75rem; font-weight:600;
  color:rgba(255,255,255,.55);
  text-align:center; display:none;
}
#msg {
  text-align:center; min-height:1.3em;
  font-size:.93rem; font-weight:700;
  margin-top:4px; padding:8px 10px;
  border-radius:10px;
  transition:opacity .4s;
}
@keyframes spin { from { transform:rotate(0deg); } to { transform:rotate(270deg); } }
#spinner {
  position:fixed; inset:0;
  display:flex; flex-direction:column;
  justify-content:center; align-items:center;
  gap:14px;
  background:rgba(0,0,0,.62);
  z-index:1000; visibility:hidden; opacity:0;
  transition:opacity .2s, visibility .2s;
}
#spinner.visible { visibility:visible; opacity:1; }
#spinner-ring {
  width:58px; height:58px;
  border:6px solid rgba(255,255,255,.25);
  border-top-color:#60a5fa;
  border-radius:50%;
  animation:spin 1s linear infinite;
}
#spinner-text { color:rgba(255,255,255,.8); font-size:.9rem; font-weight:700; }
.offline-alert {
  position:fixed; top:12px; left:50%;
  transform:translateX(-50%);
  background:#dc2626; color:white;
  padding:10px 18px; border-radius:12px;
  font-weight:700; font-size:.85rem;
  z-index:1100; display:none;
  box-shadow:0 8px 24px rgba(0,0,0,.4);
}
</style>

<!-- GUARD DE SESIÓN: redirige antes de pintar nada -->
<script>
(function sessionGuard() {
  try {
    var raw = sessionStorage.getItem('sad_user');
    if (!raw) { window.location.replace('login.html'); return; }
    var u = JSON.parse(raw);
    if (!u || !u.usuario || !u.token) {
      sessionStorage.removeItem('sad_user');
      window.location.replace('login.html');
      return;
    }
    if (typeof u.tiendaPre === 'undefined') {
      sessionStorage.removeItem('sad_user');
      window.location.replace('login.html');
    }
  } catch(e) {
    sessionStorage.removeItem('sad_user');
    window.location.replace('login.html');
  }
})();
</script>

<!-- PROXY FETCH -->
<script>
(function installProxy() {
  var _fetch = window.fetch;
  var BACKEND = "https://script.google.com/macros/s/AKfycbzkf4K28coJa5YXNv_iN08sfhjrtKenyFJgHxWaIxMGVtuABHswvySAFEmowq5vP4rD/exec";
  var PROXY   = "https://sad-proxy.colatino-ventas-enlinea.workers.dev/";
  window.BACKEND_URL = BACKEND;
  window.fetch = function(input, init) {
    init = init || {};
    try {
      var url = (typeof input === "string") ? input : (input && input.url ? input.url : "");
      if (url === BACKEND) {
        var proxied = PROXY + "?url=" + encodeURIComponent(BACKEND);
        return _fetch(proxied, init);
      }
    } catch(e) {}
    return _fetch(input, init);
  };
})();
</script>
</head>
<body>
<div class="offline-alert" id="offline-alert">⚠️ Sin conexión a internet</div>

<div id="spinner" role="status" aria-live="polite">
  <div id="spinner-ring"></div>
  <div id="spinner-text">Procesando...</div>
</div>

<div class="card">
  <div class="header">
    <a class="btn-reservas" href="reservas.html" title="Reservas">
      <img src="boton_reservas.png" alt="Reservas" />
    </a>
    <img class="logo" src="nexo-logo-full.png" alt="Nexo · Distribución Inteligente" />
    <div class="user-badge" id="userBadge" onclick="cerrarSesion()" title="Pulsa para cerrar sesión">
      👤 <span id="badgeNombre">—</span>
      <span class="nivel-tag" id="nivelTag">—</span>
      &nbsp;·&nbsp;Salir
    </div>
    <div class="app-version">SAD Ticket Upload v2.9.1</div>
  </div>

  <form id="ticketForm" novalidate>
    <div>
      <label for="fecha">Fecha</label>
      <input class="control" type="date" name="fecha" id="fecha" required />
      <div class="lock-hint" id="hintFecha" style="display:none;">🔒 Solo se puede registrar la fecha de hoy</div>
    </div>

    <div>
      <label for="tienda">Tienda</label>
      <select class="control" id="tienda" name="tienda" required>
        <option value="" disabled selected>Cargando...</option>
      </select>
    </div>

    <div>
      <label for="repartidor">Repartidor</label>
      <select class="control" id="repartidor" name="repartidor" required>
        <option value="" disabled selected>Cargando...</option>
      </select>
      <div class="lock-hint" id="hintRepartidor" style="display:none;">🔒 Repartidor fijado a tu cuenta</div>
    </div>

    <div>
      <label for="franja">Franja horaria</label>
      <select class="control" id="franja" name="franja" required>
        <option value="" disabled selected>Cargando...</option>
      </select>
    </div>

    <div class="row-2">
      <div class="group">
        <label for="pedidos">Pedidos (P)</label>
        <!-- ✅ FIX BUG 1: añadido value="0" — sin esto el campo parece relleno
             (placeholder "0") pero su valor real es "" y la validación falla -->
        <input class="control" type="number" name="pedidos" id="pedidos"
               min="-40" max="40" value="0" placeholder="0" required />
      </div>
      <div class="group">
        <label for="dobles">Dobles (D)</label>
        <input class="control" type="number" name="dobles" id="dobles"
               min="-16" max="16" value="0" />
      </div>
    </div>

    <div class="row-3">
      <div class="group">
        <label for="xr">XR</label>
        <input class="control" type="number" name="xr" id="xr"
               min="-12" max="12" value="0" />
      </div>
      <div class="group">
        <label for="km">Km</label>
        <input class="control" type="number" name="km" id="km"
               min="-200" max="200" value="0" />
      </div>
      <div class="group">
        <label for="obs">Obs</label>
        <input class="control" type="text" name="obs" id="obs"
               maxlength="20" placeholder="Opcional" />
      </div>
    </div>

    <div>
      <label>Foto del ticket</label>
      <div class="btn-foto-wrap">
        <button type="button" id="btnCamara">📷 Sacar foto</button>
        <button type="button" id="btnArchivo">🖼️ Galería</button>
      </div>
      <button type="button" id="btnGirar"
        style="display:none; margin-top:8px; background:rgba(255,255,255,0.2);
               color:#fff; border:1px solid rgba(255,255,255,0.3);
               box-shadow:none; padding:10px; font-size:0.9rem;">
        🔄 Girar foto
      </button>
      <input type="file" id="foto" name="foto" accept="image/*" style="display:none;" />
    </div>

    <img id="fotoPreview" src="" alt="Vista previa del ticket" />
    <div id="fotoInfo"></div>

    <button type="submit" id="btnSubir">⬆️ Subir ticket</button>
    <div id="msg" role="alert" aria-live="polite"></div>
  </form>
</div>

<script>
/* ============================================================
   REFERENCIAS DOM
============================================================ */
const msgEl       = document.getElementById('msg');
const spinnerEl   = document.getElementById('spinner');
const spinnerTxt  = document.getElementById('spinner-text');
const fotoInput   = document.getElementById('foto');
const fotoPreview = document.getElementById('fotoPreview');
const fotoInfo    = document.getElementById('fotoInfo');
const fechaInput  = document.getElementById('fecha');
const repartSel   = document.getElementById('repartidor');
const tiendaSel   = document.getElementById('tienda');

/* ============================================================
   SESIÓN — niveles: admin / usuario 1 / usuario 2
============================================================ */
let sesion = null;
try { sesion = JSON.parse(sessionStorage.getItem('sad_user')); } catch(e) {}

const NIVEL        = (sesion && sesion.nivel ? String(sesion.nivel).toLowerCase().trim() : 'usuario 1');
const ES_ADMIN     = NIVEL === 'admin';
const ES_USUARIO_1 = NIVEL === 'usuario 1' || NIVEL === 'usuario1';
const ES_USUARIO_2 = NIVEL === 'usuario 2' || NIVEL === 'usuario2';
const ES_USUARIO_3 = NIVEL === 'usuario 3' || NIVEL === 'usuario3';

document.getElementById('badgeNombre').textContent = sesion?.nombre || '—';
const nivelTag = document.getElementById('nivelTag');
nivelTag.textContent = NIVEL;
if (ES_ADMIN) nivelTag.classList.add('admin');

// Pasa el usuario ya logueado al Módulo de Reservas, para que no vuelva a pedir contraseña.
const btnReservas = document.querySelector('.btn-reservas');
if (btnReservas) {
  btnReservas.href = 'reservas.html?u=' + encodeURIComponent((sesion && sesion.usuario) || '');
}

function cerrarSesion() {
  if (confirm('¿Cerrar sesión?')) {
    sessionStorage.removeItem('sad_user');
    localStorage.removeItem('sad_user');
    window.location.replace('login.html');
  }
}

/* ============================================================
   SPINNER / MENSAJES
============================================================ */
function showSpinner(t) { spinnerTxt.textContent = t || 'Procesando...'; spinnerEl.classList.add('visible'); }
function hideSpinner()  { spinnerEl.classList.remove('visible'); }

function setMsg(text, color) {
  msgEl.textContent = text;
  msgEl.style.color = color || '#fff';
  msgEl.style.background = color
    ? (color === '#9dffb0' ? 'rgba(34,197,94,.12)' :
       color === '#ffcc00' ? 'rgba(251,191,36,.12)' : 'rgba(239,68,68,.12)')
    : 'transparent';
  msgEl.style.opacity = '1';
}
function clearMsg() {
  msgEl.style.transition = 'opacity .5s';
  msgEl.style.opacity = '0';
  setTimeout(() => { msgEl.textContent = ''; msgEl.style.background = 'transparent'; }, 520);
}
function showOfflineAlert() {
  const el = document.getElementById('offline-alert');
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 4000);
}

/* ============================================================
   FECHA POR DEFECTO Y BLOQUEO
============================================================ */
const HOY = new Date().toISOString().split('T')[0];
fechaInput.value = HOY;

if (!ES_ADMIN) {
  fechaInput.min      = HOY;
  fechaInput.max      = HOY;
  fechaInput.readOnly = true;
  fechaInput.classList.add('locked');
  document.getElementById('hintFecha').style.display = 'flex';
  fechaInput.addEventListener('change', () => {
    if (fechaInput.value !== HOY) fechaInput.value = HOY;
  });
}

/* ============================================================
   CARGAR LISTAS
============================================================ */
const PROXY_URL   = "https://sad-proxy.colatino-ventas-enlinea.workers.dev/";
const BACKEND_GET = PROXY_URL + "?url=" + encodeURIComponent(
  "https://script.google.com/macros/s/AKfycbzkf4K28coJa5YXNv_iN08sfhjrtKenyFJgHxWaIxMGVtuABHswvySAFEmowq5vP4rD/exec"
);

let listasCargadas = false;
let TIENDAS_FRANJAS = {}; // { "TRAVESIA": ["10-13H","13-16H",...], "ONLINE": ["10-22H"], ... }

/* Caché local: pinta al instante con lo último guardado mientras se
   refresca en segundo plano. Evita esperar red en cada apertura. */
const LISTAS_CACHE_KEY = 'nexo_listas_cache_v2';
function leerListasCache() {
  try {
    const raw = localStorage.getItem(LISTAS_CACHE_KEY);
    if (!raw) return null;
    const obj = JSON.parse(raw);
    return (obj && obj.data) ? obj.data : null;
  } catch(e) { return null; }
}
function guardarListasCache(data) {
  try { localStorage.setItem(LISTAS_CACHE_KEY, JSON.stringify({ data: data, ts: Date.now() })); }
  catch(e) {}
}

function aplicarDatosListas(data) {
  fillSelect('tienda',     data.tiendas,     'Seleccione tienda...');
  fillSelect('repartidor', data.repartidores, 'Seleccione repartidor...');
  TIENDAS_FRANJAS = data.franjasPorTienda || {};
  listasCargadas  = true;

  aplicarReglasRepartidor();
  aplicarReglasTienda();
  aplicarReglasFranja();
}

async function cargarListas() {
  // 1) Pintar de inmediato con la última copia guardada, sin esperar red
  const cacheado = leerListasCache();
  if (cacheado) {
    try { aplicarDatosListas(cacheado); } catch(e) { console.warn('[Nexo] Caché de listas inválida:', e); }
  }

  // 2) Refrescar siempre contra el servidor (de entrada si no había caché)
  try {
    console.time('[Nexo] FETCH tiendas/repartidores/franjas');
    const r = await fetch(BACKEND_GET);
    console.timeEnd('[Nexo] FETCH tiendas/repartidores/franjas');

    if (!r.ok) throw new Error('HTTP ' + r.status);

    const data = await r.json();

    if (!data.tiendas || !data.repartidores || !data.franjasPorTienda) {
      throw new Error('Respuesta incompleta: ' + JSON.stringify(data));
    }

    guardarListasCache(data);
    aplicarDatosListas(data);

    console.log('[Nexo] sesion:', JSON.stringify(sesion));
    console.log('[Nexo] tiendaPre:', sesion && sesion.tiendaPre);

  } catch (err) {
    if (!cacheado) {
      setMsg('⚠️ Error cargando listas: ' + err.message, '#ffcc00');
    }
    console.error('[Nexo] cargarListas:', err);
  }
}
cargarListas();

// Si la tienda cambia (admin / usuario 2 pueden elegir otra), recalcular sus franjas
tiendaSel.addEventListener('change', aplicarReglasFranja);

// Revisa cada minuto si alguna franja ya cruzó el corte de "1h antes de caducar"
setInterval(() => { if (listasCargadas) aplicarReglasFranja(); }, 60000);

function fillSelect(id, arr, placeholder) {
  const el = document.getElementById(id);
  el.innerHTML = '';
  const ph = document.createElement('option');
  ph.value = ''; ph.textContent = placeholder;
  ph.disabled = true; ph.selected = true;
  el.appendChild(ph);
  (arr || []).forEach(v => {
    const op = document.createElement('option');
    op.value = v; op.textContent = v;
    el.appendChild(op);
  });
}

/* ============================================================
   REGLAS REPARTIDOR
============================================================ */
function aplicarReglasRepartidor() {
  if (!listasCargadas || !sesion) return;
  if (ES_USUARIO_1 || ES_USUARIO_3) {
    const opciones = Array.from(repartSel.options).map(o => o.value);
    const miNombre = sesion.nombre || sesion.usuario;
    const match    = opciones.find(o =>
      o.toLowerCase().trim() === miNombre.toLowerCase().trim()
    );
    if (match) {
      repartSel.value = match;
    } else {
      const op = document.createElement('option');
      op.value = miNombre; op.textContent = miNombre; op.selected = true;
      repartSel.appendChild(op);
      repartSel.value = miNombre;
    }
    repartSel.disabled = true;
    repartSel.classList.add('locked');
    document.getElementById('hintRepartidor').style.display = 'flex';
  }
}

/* ============================================================
   TIENDA PREDEFINIDA
============================================================ */
function aplicarReglasTienda() {
  const tiendaPre = sesion && sesion.tiendaPre ? sesion.tiendaPre.trim() : '';
  if (!tiendaPre) return;
  const opciones  = Array.from(tiendaSel.options).map(o => o.value);
  const match     = opciones.find(o =>
    o.toLowerCase().trim() === tiendaPre.toLowerCase()
  );
  if (match) {
    tiendaSel.value = match;
  } else {
    const op = document.createElement('option');
    op.value = tiendaPre; op.textContent = tiendaPre; op.selected = true;
    tiendaSel.appendChild(op);
    tiendaSel.value = tiendaPre;
  }
}

/* ============================================================
   FRANJA HORARIA — según la tienda elegida y la hora actual
   Regla: se puede elegir una franja hasta 1 hora antes de que acabe.
   Si la tienda solo tiene UNA franja (p.ej. "ONLINE" 10-22H), el corte
   es justo en su hora de fin — hay que estar dentro del tramo.
   El corte por hora solo se aplica a usuario 1 y usuario 2;
   admin y usuario 3 ven todas las franjas de la tienda sin filtrar por hora.
============================================================ */
function parseFranja(str) {
  const m = /^(\d{1,2})-(\d{1,2})H$/i.exec(String(str).trim());
  if (!m) return null;
  return { inicio: parseInt(m[1], 10) * 60, fin: parseInt(m[2], 10) * 60 };
}

function getFranjasPermitidas(listaFranjas) {
  const ahora = new Date();
  const mins  = ahora.getHours() * 60 + ahora.getMinutes();
  const esTramoUnico = listaFranjas.length === 1;
  return listaFranjas.filter(f => {
    const p = parseFranja(f);
    if (!p) return true; // formato no reconocido: no bloquear por seguridad
    const limite = esTramoUnico ? p.fin : (p.fin - 60);
    return mins <= limite;
  });
}

function aplicarReglasFranja() {
  const franjaSel   = document.getElementById('franja');
  const tienda      = tiendaSel.value;
  const listaTienda = TIENDAS_FRANJAS[tienda] || [];

  if (!tienda || listaTienda.length === 0) {
    fillSelect('franja', [], 'Seleccione franja horaria...');
    franjaSel.disabled = false;
    franjaSel.classList.remove('locked');
    return;
  }

  const conFiltroHora = ES_USUARIO_1 || ES_USUARIO_2;
  const permitidas    = conFiltroHora ? getFranjasPermitidas(listaTienda) : listaTienda;

  const seleccionActual = franjaSel.value;
  fillSelect('franja', permitidas, 'Seleccione franja horaria...');

  if (permitidas.length === 0) {
    setMsg('⚠️ Fuera del horario disponible para esta tienda', '#ffcc00');
  } else if (permitidas.includes(seleccionActual)) {
    franjaSel.value = seleccionActual;
  } else {
    franjaSel.value = permitidas[0];
  }

  if (permitidas.length === 1) {
    franjaSel.disabled = true;
    franjaSel.classList.add('locked');
  } else {
    franjaSel.disabled = false;
    franjaSel.classList.remove('locked');
  }
}

/* ============================================================
   OPTIMIZACIÓN DE FOTO — EN COLOR, SIN FILTROS, SIN RECORTE

   ✅ FIX BUG 2: casos 6, 7 y 8 del switch EXIF corregidos.
   El error original era que visW y visH estaban intercambiados
   como parámetros de traslación en esos tres casos, haciendo
   que la imagen se dibujase parcialmente fuera del canvas y
   apareciera una franja blanca en el JPEG resultante.

   Para orientaciones 5-8 (fotos con ejes intercambiados):
     visW = img.naturalHeight  (dimension larga → nuevo ancho)
     visH = img.naturalWidth   (dimension corta → nuevo alto)

   Transforms correctos (canvas.translate + canvas.rotate en forma matricial):
     case 6 (+90° CW): translate(visW, 0)    → transform(0,1,-1,0,visW,0)
     case 7 (−90°+HF): translate(visW, visH) → transform(0,-1,-1,0,visW,visH)
     case 8 (−90° CW): translate(0, visH)    → transform(0,-1,1,0,0,visH)
============================================================ */
function getExifOrientation(dataURL) {
  try {
    const b64 = dataURL.split(',')[1];
    const bin = atob(b64);
    const buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    const dv = new DataView(buf.buffer);
    if (dv.getUint16(0) !== 0xFFD8) return 1;
    let offset = 2;
    while (offset < dv.byteLength - 2) {
      const marker = dv.getUint16(offset);
      const len    = dv.getUint16(offset + 2);
      if (marker === 0xFFE1) {
        if (dv.getUint32(offset + 4) === 0x45786966 && dv.getUint16(offset + 8) === 0x0000) {
          const tiff = offset + 10;
          const le   = dv.getUint16(tiff) === 0x4949;
          const ifd  = dv.getUint32(tiff + 4, le);
          const n    = dv.getUint16(tiff + ifd, le);
          for (let i = 0; i < n; i++) {
            const tag = dv.getUint16(tiff + ifd + 2 + i * 12, le);
            if (tag === 0x0112) return dv.getUint16(tiff + ifd + 2 + i * 12 + 8, le);
          }
        }
        return 1;
      }
      if ((marker & 0xFF00) !== 0xFF00) return 1;
      offset += 2 + len;
    }
  } catch(e) {}
  return 1;
}

function optimizarFoto(file, rotacionExtra) {
  rotacionExtra = rotacionExtra || 0;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('No se pudo leer la imagen'));
    reader.onload  = function(ev) {
      const dataURL = ev.target.result;
      const img     = new Image();
      img.onerror   = () => reject(new Error('Imagen no válida'));
      img.onload    = function() {
        try {
          const orientation = getExifOrientation(dataURL);

          /* Paso 1: canvas con corrección EXIF → imagen en orientación visual correcta */
          const swapExif = [5, 6, 7, 8].includes(orientation);
          const visW = swapExif ? img.naturalHeight : img.naturalWidth;
          const visH = swapExif ? img.naturalWidth  : img.naturalHeight;

          const c1   = document.createElement('canvas');
          c1.width   = visW;
          c1.height  = visH;
          const ctx1 = c1.getContext('2d');
          ctx1.save();

          switch (orientation) {
            case 2: ctx1.transform(-1, 0, 0,  1, visW, 0);    break; // flip H
            case 3: ctx1.transform(-1, 0, 0, -1, visW, visH); break; // rot 180°
            case 4: ctx1.transform( 1, 0, 0, -1, 0,    visH); break; // flip V
            case 5: ctx1.transform( 0, 1, 1,  0, 0,    0);    break; // transponer
            // ✅ FIXED: los 3 casos siguientes usaban visH donde va visW y viceversa
            case 6: ctx1.transform( 0, 1,-1,  0, visW, 0);    break; // +90° CW
            case 7: ctx1.transform( 0,-1,-1,  0, visW, visH); break; // −90° + flip H
            case 8: ctx1.transform( 0,-1, 1,  0, 0,    visH); break; // −90° CW
            default: break;
          }
          ctx1.drawImage(img, 0, 0);
          ctx1.restore();

          /* Paso 2: rotación manual adicional (0 / 90 / 180 / 270) */
          const swap2  = rotacionExtra === 90 || rotacionExtra === 270;
          const finalW = swap2 ? visH : visW;
          const finalH = swap2 ? visW : visH;

          const MAX   = 1800;
          const scale = Math.min(MAX / Math.max(finalW, finalH), 1);
          const dstW  = Math.round(finalW * scale);
          const dstH  = Math.round(finalH * scale);

          const c2   = document.createElement('canvas');
          c2.width   = dstW;
          c2.height  = dstH;
          const ctx2 = c2.getContext('2d');

          // Fondo blanco (necesario para JPEG; invisible si la imagen llena el canvas)
          ctx2.fillStyle = '#fff';
          ctx2.fillRect(0, 0, dstW, dstH);

          ctx2.save();
          ctx2.translate(dstW / 2, dstH / 2);
          ctx2.rotate(rotacionExtra * Math.PI / 180);

          const sw = Math.round(visW * scale);
          const sh = Math.round(visH * scale);
          ctx2.drawImage(c1, -sw / 2, -sh / 2, sw, sh);
          ctx2.restore();

          /* Exportar EN COLOR, JPG calidad 0.82 */
          c2.toBlob(blob => {
            if (!blob) return reject(new Error('Error al exportar'));
            resolve(new File([blob], 'ticket.jpg', { type: 'image/jpeg' }));
          }, 'image/jpeg', 0.82);

        } catch(err) { reject(err); }
      };
      img.src = dataURL;
    };
    reader.readAsDataURL(file);
  });
}

/* ============================================================
   COLA OFFLINE — IndexedDB
============================================================ */
const DB_NAME    = 'nexo-tickets-queue';
const DB_VERSION = 1;
const STORE_NAME = 'pendientes';

function abrirDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
      }
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror   = e => reject(e.target.error);
  });
}

async function guardarEnCola(datos) {
  const db    = await abrirDB();
  const tx    = db.transaction(STORE_NAME, 'readwrite');
  const store = tx.objectStore(STORE_NAME);
  const item  = { ...datos, _ts: Date.now(), _intentos: 0 };
  return new Promise((resolve, reject) => {
    const req = store.add(item);
    req.onsuccess = () => resolve(req.result);
    req.onerror   = e  => reject(e.target.error);
  });
}

async function obtenerPendientes() {
  const db    = await abrirDB();
  const tx    = db.transaction(STORE_NAME, 'readonly');
  const store = tx.objectStore(STORE_NAME);
  return new Promise((resolve, reject) => {
    const req = store.getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror   = e  => reject(e.target.error);
  });
}

async function eliminarDeCola(id) {
  const db    = await abrirDB();
  const tx    = db.transaction(STORE_NAME, 'readwrite');
  const store = tx.objectStore(STORE_NAME);
  return new Promise((resolve, reject) => {
    const req = store.delete(id);
    req.onsuccess = () => resolve();
    req.onerror   = e  => reject(e.target.error);
  });
}

async function incrementarIntentos(id) {
  const db    = await abrirDB();
  const tx    = db.transaction(STORE_NAME, 'readwrite');
  const store = tx.objectStore(STORE_NAME);
  return new Promise((resolve, reject) => {
    const getReq = store.get(id);
    getReq.onsuccess = () => {
      const item = getReq.result;
      if (!item) return resolve();
      item._intentos = (item._intentos || 0) + 1;
      const putReq = store.put(item);
      putReq.onsuccess = () => resolve();
      putReq.onerror   = e => reject(e.target.error);
    };
    getReq.onerror = e => reject(e.target.error);
  });
}

async function contarPendientes() {
  const db    = await abrirDB();
  const tx    = db.transaction(STORE_NAME, 'readonly');
  const store = tx.objectStore(STORE_NAME);
  return new Promise((resolve, reject) => {
    const req = store.count();
    req.onsuccess = () => resolve(req.result);
    req.onerror   = ()  => resolve(0);
  });
}

async function actualizarBadgePendientes() {
  try {
    const n = await contarPendientes();
    let badge = document.getElementById('badgePendientes');

// Un fallo "transitorio" es un problema de red/infraestructura de Google
// (por ejemplo Apps Script devolviendo una página de error HTML en vez del
// texto esperado) — vale la pena reintentarlo. Un error real de la app
// (ej. "ERROR: imagen vacía") es determinístico y reintentarlo no ayuda.
function esFalloTransitorio(resp, text) {
  return !resp.ok || /^\s*<!DOCTYPE|^\s*<html/i.test(text || '');
}

async function enviarTicketDeCola(item) {
  const { id, ...datos } = item;
  const resp = await fetch(window.BACKEND_URL, {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify(datos)
  });
  const text = await resp.text();
  if (esFalloTransitorio(resp, text)) throw new Error(text || ('HTTP ' + resp.status));
  if (text.startsWith('ERROR:')) throw Object.assign(new Error(text), { noReintentar: true });
  return text; // 'OK | ...' o 'YA_SUBIDO | ...'
}

let _procesandoCola = false;

async function procesarCola(mostrarMsg) {
  if (_procesandoCola || !navigator.onLine) return;
  _procesandoCola = true;
  try {
    const pendientes = await obtenerPendientes();
    if (pendientes.length === 0) { _procesandoCola = false; return; }
    if (mostrarMsg) setMsg(`⏳ Subiendo ${pendientes.length} ticket(s) pendiente(s)...`, '#ffcc00');
    let ok = 0, fail = 0;
    for (const item of pendientes) {
      // Un ticket que ya falló muchas veces se descarta para no reintentarlo
      // para siempre (protección ante un payload realmente inválido).
      if ((item._intentos || 0) >= 20) {
        console.warn('[Nexo] Cola: descartando item tras 20 intentos', item.id);
        await eliminarDeCola(item.id);
        continue;
      }
      try {
        await enviarTicketDeCola(item);
        await eliminarDeCola(item.id);
        ok++;
      } catch(e) {
        console.warn('[Nexo] Cola: fallo en item', item.id, e.message);
        if (e.noReintentar) {
          await eliminarDeCola(item.id); // error real de la app, no tiene sentido guardarlo
        } else {
          await incrementarIntentos(item.id);
          fail++;
        }
      }
    }
    await actualizarBadgePendientes();
    if (ok > 0) {
      setMsg(`✅ ${ok} ticket(s) pendiente(s) subido(s) correctamente`, '#9dffb0');
      setTimeout(clearMsg, 4000);
    } else if (mostrarMsg && fail > 0) {
      setMsg(`⚠️ Seguimos intentando subir ${fail} ticket(s) pendiente(s)...`, '#ffcc00');
    }
  } catch(e) {
    console.error('[Nexo] procesarCola:', e);
  }
  _procesandoCola = false;
}

window.addEventListener('online', () => {
  console.log('[Nexo] Conexión recuperada — procesando cola');
  setTimeout(() => procesarCola(true), 1500);
});

// Reintento periódico en segundo plano: cubre fallos intermitentes de Google
// aunque el teléfono siga "online" todo el tiempo (no solo al recuperar
// señal). Silencioso salvo cuando algo termina de subirse.
setInterval(() => procesarCola(false), 30000);

window.addEventListener('load', async () => {
  await actualizarBadgePendientes();
  if (navigator.onLine) {
    const n = await contarPendientes();
    if (n > 0) setTimeout(() => procesarCola(true), 2000);
  }
});

/* ============================================================
   ENVÍO DEL TICKET
============================================================ */
let _submitting = false;

/**
 * Envía el ticket reintentando automáticamente cuando el fallo parece ser
 * un problema transitorio de Google (ej. Apps Script devolviendo una página
 * de error HTML en vez del texto esperado — ver esFalloTransitorio). Un
 * error real de la app (ERROR: ...) se corta al primer intento.
 */
async function enviarTicketConReintentos(payload, intentos = 3, esperaBaseMs = 1500) {
  let ultimoError;
  for (let i = 0; i < intentos; i++) {
    try {
      const resp = await fetch(window.BACKEND_URL, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify(payload)
      });
      const text = await resp.text();

      if (esFalloTransitorio(resp, text)) {
        throw new Error(text || ('HTTP ' + resp.status));
      }
      if (text.startsWith('ERROR:')) {
        throw Object.assign(new Error(text), { noReintentar: true });
      }
      return text; // 'OK | ...' o 'YA_SUBIDO | ...'
    } catch(err) {
      if (err.noReintentar) throw err;
      ultimoError = err;
      if (i < intentos - 1) {
        showSpinner(`Subiendo ticket... reintentando (${i + 2}/${intentos})`);
        await new Promise(r => setTimeout(r, esperaBaseMs * (i + 1)));
      }
    }
  }
  throw ultimoError;
}

document.getElementById('ticketForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  if (_submitting) return;

  const foto = fotoInput.files[0];
  if (!foto) { alert('Por favor, selecciona una foto del ticket.'); return; }

  // Forzar fecha de hoy para usuario 1 y usuario 2
  if (!ES_ADMIN) fechaInput.value = HOY;

  // Forzar repartidor para usuario 1
  if (ES_USUARIO_1 && sesion) {
    const miNombre = sesion.nombre || sesion.usuario;
    const opciones = Array.from(repartSel.options).map(o => o.value);
    const match    = opciones.find(o => o.toLowerCase().trim() === miNombre.toLowerCase().trim());
    repartSel.value = match || miNombre;
  }

  // Validar campos obligatorios
  const campos = ['fecha', 'tienda', 'repartidor', 'franja', 'pedidos'];
  for (const c of campos) {
    if (!document.getElementById(c).value) {
      alert('Por favor, completa todos los campos obligatorios.');
      return;
    }
  }

  // Revalidar que la franja elegida sigue disponible (por si pasó tiempo
  // con la pestaña abierta y ya cruzó el corte de "1h antes de caducar")
  if (ES_USUARIO_1 || ES_USUARIO_2) {
    const tiendaActual    = document.getElementById('tienda').value;
    const listaTienda     = TIENDAS_FRANJAS[tiendaActual] || [];
    const permitidasAhora = getFranjasPermitidas(listaTienda);
    const franjaElegida   = document.getElementById('franja').value;
    if (!permitidasAhora.includes(franjaElegida)) {
      alert('La franja horaria seleccionada ya no está disponible. Elige otra, por favor.');
      aplicarReglasFranja();
      return;
    }
  }

  _submitting = true;
  showSpinner('Procesando foto...');
  setMsg('', '');

  try {
    // Preparar foto
    let fotoOpt;
    if (fotoInput._procesada) {
      fotoOpt = fotoInput._procesada;
    } else {
      try {
        fotoOpt = await optimizarFoto(foto, rotacionManual);
      } catch(optErr) {
        console.warn('[Nexo] Optimización falló, usando original:', optErr);
        fotoOpt = foto;
      }
    }

    showSpinner('Subiendo ticket...');

    // Convertir a base64
    const base64 = await new Promise((res, rej) => {
      const r = new FileReader();
      r.onerror = () => rej(new Error('Error leyendo foto'));
      r.onload  = ev => res(ev.target.result);
      r.readAsDataURL(fotoOpt);
    });

    const payload = {
      fecha:         fechaInput.value,
      tienda:        document.getElementById('tienda').value,
      repartidor:    document.getElementById('repartidor').value,
      franja:        document.getElementById('franja').value,
      pedidos:       document.getElementById('pedidos').value,
      dobles:        document.getElementById('dobles').value,
      xr:            document.getElementById('xr').value,
      km:            document.getElementById('km').value,
      obs:           document.getElementById('obs').value,
      imagenBase64:  base64,
      usuarioSesion: sesion?.usuario || '',
      nivelSesion:   NIVEL
    };

    if (!navigator.onLine) {
      await guardarEnCola(payload);
      await actualizarBadgePendientes();
      setMsg('📥 Sin conexión — ticket guardado, se subirá al recuperar red', '#ffcc00');
      resetFormulario();
      showOfflineAlert();
      return;
    }

    // Envío online — con reintentos automáticos ante fallos intermitentes
    // de Google Apps Script (ver enviarTicketConReintentos más arriba).
    const text = await enviarTicketConReintentos(payload);

    if (text.startsWith('YA_SUBIDO')) {
      setMsg('✅ Este ticket ya estaba subido — no hace falta subirlo de nuevo', '#9dffb0');
    } else {
      setMsg('✅ Ticket subido correctamente', '#9dffb0');
    }
    setTimeout(clearMsg, 5000);
    resetFormulario();

  } catch(err) {
    console.error('[Nexo] submit:', err);

    if (err.noReintentar) {
      // Error real de la app (ej. imagen vacía) — reintentar no ayuda, se avisa directo
      setMsg('❌ Error: ' + err.message, '#ff6b6b');
    } else {
      // Sin conexión, o fallo intermitente de Google tras varios reintentos:
      // el ticket NO se pierde — se guarda y se reintenta solo en segundo
      // plano (cada 30s y al volver la conexión). El backend es idempotente:
      // si este ticket ya se había subido en un intento anterior, no se
      // duplica el archivo en Drive, así que reintentarlo es seguro.
      try {
        await guardarEnCola(payload);
        await actualizarBadgePendientes();
        setMsg('⏳ Problema de conexión con el servidor — el ticket quedó guardado y se subirá solo (no hace falta repetirlo)', '#ffcc00');
        resetFormulario();
      } catch(qErr) {
        setMsg('❌ Error: ' + err.message, '#ff6b6b');
      }
    }
  } finally {
    hideSpinner();
    _submitting = false;
  }
});

/* ============================================================
   RESET FORMULARIO
============================================================ */
function resetFormulario() {
  fotoInput.value      = '';
  fotoInput._procesada = null;
  fotoPreview.style.display = 'none';
  fotoPreview.src      = '';
  fotoInfo.style.display = 'none';
  fotoInfo.textContent = '';
  document.getElementById('btnGirar').style.display = 'none';
  rotacionManual = 0;

  document.getElementById('pedidos').value = '0';
  document.getElementById('dobles').value  = '0';
  document.getElementById('xr').value      = '0';
  document.getElementById('km').value      = '0';
  document.getElementById('obs').value     = '';

  if (ES_ADMIN) {
    document.getElementById('tienda').selectedIndex = 0;
    repartSel.selectedIndex = 0;
    document.getElementById('franja').selectedIndex = 0;
  } else {
    aplicarReglasTienda();
    if (ES_USUARIO_1) aplicarReglasRepartidor();
    aplicarReglasFranja();
  }
}
