<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#003366" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Nexo Tickets" />
<meta name="display" content="standalone" />
<link rel="manifest" href="manifest.json?v=5">
<link rel="icon" href="nexo-icon-192.png">
<link rel="apple-touch-icon" href="nexo-icon-192.png">
<title>Nexo · SAD Tickets</title>

<style>
:root {
  --bg1:#003366; --bg2:#0077cc;
  --card-bg:rgba(255,255,255,.12);
  --text-main:#fff; --text-dark:#003366;
  --radius-card:24px; --radius-field:12px;
  --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", sans-serif;
}
*, *::before, *::after { box-sizing:border-box; -webkit-font-smoothing:antialiased; font-family:var(--font); }
body {
  margin:0; min-height:100vh;
  background:linear-gradient(180deg, var(--bg1), var(--bg2));
  color:var(--text-main);
  display:flex; justify-content:center; align-items:flex-start;
  padding:24px 16px 56px;
}

.card {
  width:100%; max-width:420px;
  background:var(--card-bg);
  border-radius:var(--radius-card);
  box-shadow:0 16px 40px rgba(0,0,0,.45);
  padding:20px 16px 28px;
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
}

.header { text-align:center; margin-bottom:18px; }
.logo {
  width:170px; max-width:65%;
  height:auto; display:block;
  margin:0 auto 10px auto;
  background:#fff;
  border-radius:14px;
  padding:8px 14px;
}
.user-badge {
  display:inline-flex; align-items:center; gap:6px;
  background:rgba(255,255,255,.15);
  border:1px solid rgba(255,255,255,.2);
  border-radius:20px;
  padding:5px 14px 5px 10px;
  font-size:.8rem; font-weight:700;
  color:rgba(255,255,255,.92);
  margin-bottom:6px; cursor:pointer;
  transition:background .18s;
}
.user-badge:hover { background:rgba(255,255,255,.23); }
.nivel-tag {
  display:inline-block;
  background:rgba(96,165,250,.25);
  color:#bfdbfe;
  padding:2px 8px;
  border-radius:10px;
  font-size:.65rem;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.05em;
  margin-left:6px;
}
.nivel-tag.admin { background:rgba(251,146,60,.25); color:#fed7aa; }
.app-version { font-size:.78rem; font-weight:600; color:rgba(255,255,255,.45); }

form { display:flex; flex-direction:column; gap:12px; }
label {
  font-size:.88rem; font-weight:600;
  color:var(--text-main);
  margin-bottom:3px; display:block;
}

.control {
  width:100%; border:none; border-radius:var(--radius-field);
  background:#fff; color:var(--text-dark);
  font-weight:500; padding:13px 12px;
  font-size: max(1rem, 16px);
  outline:none;
}
select.control { -webkit-appearance:none; appearance:none; }

/* Campos bloqueados (lock visual) */
.control.locked, .control:disabled {
  background:#e5e7eb !important;
  color:#475569 !important;
  cursor:not-allowed !important;
  opacity:1;
}
.lock-hint {
  font-size:.7rem;
  color:rgba(255,255,255,.6);
  font-style:italic;
  margin-top:-8px;
  display:flex; align-items:center; gap:4px;
}

.row-2 { display:flex; gap:12px; }
.row-2 .group { flex:1; min-width:0; }
.row-3 { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.row-3 .group label { font-size:.82rem; text-align:center; }
.row-3 .control { text-align:center; padding:12px 4px; }

button {
  width:100%; border:none;
  border-radius:var(--radius-field);
  background:#fff; color:var(--text-dark);
  font-weight:700; padding:15px 14px;
  font-size: max(1rem, 16px);
  cursor:pointer;
  box-shadow:0 8px 22px rgba(0,0,0,.38);
  transition:transform .12s, box-shadow .18s;
}
button:active { transform:scale(.97); }

.btn-foto-wrap { display:flex; gap:10px; }
.btn-foto-wrap button { flex:1; }

#fotoPreview {
  width:100%; border-radius:12px;
  max-height:220px; object-fit:contain;
  display:none;
  border:2px solid rgba(255,255,255,.3);
  background:rgba(0,0,0,.2);
}
#fotoInfo {
  font-size:.75rem; font-weight:600;
  color:rgba(255,255,255,.55);
  text-align:center; display:none;
}

#msg {
  text-align:center; min-height:1.3em;
  font-size:.93rem; font-weight:700;
  margin-top:4px; padding:8px 10px;
  border-radius:10px;
  transition:opacity .4s;
}

@keyframes spin { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
#spinner {
  position:fixed; inset:0;
  display:flex; flex-direction:column;
  justify-content:center; align-items:center;
  gap:14px;
  background:rgba(0,0,0,.62);
  z-index:1000; visibility:hidden; opacity:0;
  transition:opacity .2s, visibility .2s;
}
#spinner.visible { visibility:visible; opacity:1; }
#spinner-ring {
  width:58px; height:58px;
  border:6px solid rgba(255,255,255,.25);
  border-top-color:#60a5fa;
  border-radius:50%;
  animation:spin 1s linear infinite;
}
#spinner-text {
  color:rgba(255,255,255,.8);
  font-size:.9rem; font-weight:700;
}

.offline-alert {
  position:fixed; top:12px; left:50%;
  transform:translateX(-50%);
  background:#dc2626; color:white;
  padding:10px 18px; border-radius:12px;
  font-weight:700; font-size:.85rem;
  z-index:1100; display:none;
  box-shadow:0 8px 24px rgba(0,0,0,.4);
}
</style>

<!-- GUARD DE SESIÓN: redirige antes de pintar nada -->
<script>
(function sessionGuard() {
  try {
    var raw = sessionStorage.getItem('sad_user');
    if (!raw) { window.location.replace('login.html'); return; }
    var u = JSON.parse(raw);
    if (!u || !u.usuario || !u.token) {
      sessionStorage.removeItem('sad_user');
      window.location.replace('login.html');
      return;
    }
    // Si la sesión no tiene tiendaPre (sesión antigua), forzar re-login
    if (typeof u.tiendaPre === 'undefined') {
      sessionStorage.removeItem('sad_user');
      window.location.replace('login.html');
    }
  } catch(e) {
    sessionStorage.removeItem('sad_user');
    window.location.replace('login.html');
  }
})();
</script>

<!-- PROXY FETCH -->
<script>
(function installProxy() {
  var _fetch = window.fetch;
  var BACKEND = "https://script.google.com/macros/s/AKfycbwTwp6Cc35zWr18MeSc9hkE18m0j_Km6S9mOv5kY-2AFrHnFivLLiplQTyQRL9ysg7R/exec";
  var PROXY   = "https://sad-proxy.colatino-ventas-enlinea.workers.dev/";
  window.BACKEND_URL = BACKEND;
  window.fetch = function(input, init) {
    init = init || {};
    try {
      var url = (typeof input === "string") ? input : (input && input.url ? input.url : "");
      if (url === BACKEND) {
        var proxied = PROXY + "?url=" + encodeURIComponent(BACKEND);
        return _fetch(proxied, init);
      }
    } catch(e) { /* sin proxy si falla */ }
    return _fetch(input, init);
  };
})();
</script>
</head>
<body>

<div class="offline-alert" id="offline-alert">⚠️ Sin conexión a internet</div>

<div id="spinner" role="status" aria-live="polite">
  <div id="spinner-ring"></div>
  <div id="spinner-text">Procesando...</div>
</div>

<div class="card">

  <div class="header">
    <img class="logo" src="nexo-logo-full.png" alt="Nexo · Distribución Inteligente" />
    <div class="user-badge" id="userBadge" onclick="cerrarSesion()" title="Pulsa para cerrar sesión">
      👤 <span id="badgeNombre">—</span>
      <span class="nivel-tag" id="nivelTag">—</span>
      &nbsp;·&nbsp;Salir
    </div>
    <div class="app-version">SAD Ticket Upload v2.5</div>
  </div>

  <form id="ticketForm" novalidate>

    <div>
      <label for="fecha">Fecha</label>
      <input class="control" type="date" name="fecha" id="fecha" required />
      <div class="lock-hint" id="hintFecha" style="display:none;">🔒 Solo se puede registrar la fecha de hoy</div>
    </div>

    <div>
      <label for="tienda">Tienda</label>
      <select class="control" id="tienda" name="tienda" required>
        <option value="" disabled selected>Cargando...</option>
      </select>
    </div>

    <div>
      <label for="repartidor">Repartidor</label>
      <select class="control" id="repartidor" name="repartidor" required>
        <option value="" disabled selected>Cargando...</option>
      </select>
      <div class="lock-hint" id="hintRepartidor" style="display:none;">🔒 Repartidor fijado a tu cuenta</div>
    </div>

    <div>
      <label for="franja">Franja horaria</label>
      <select class="control" id="franja" name="franja" required>
        <option value="" disabled selected>Cargando...</option>
      </select>
    </div>

    <div class="row-2">
      <div class="group">
        <label for="pedidos">Pedidos (P)</label>
        <input class="control" type="number" name="pedidos" id="pedidos" min="-40" max="40" placeholder="0" required />
      </div>
      <div class="group">
        <label for="dobles">Dobles (D)</label>
        <input class="control" type="number" name="dobles" id="dobles" min="-16" max="16" value="0" required />
      </div>
    </div>

    <div class="row-3">
      <div class="group">
        <label for="xr">XR</label>
        <input class="control" type="number" name="xr" id="xr" min="-12" max="12" value="0" required />
      </div>
      <div class="group">
        <label for="km">Km</label>
        <input class="control" type="number" name="km" id="km" min="-200" max="200" value="0" required />
      </div>
      <div class="group">
        <label for="obs">Obs</label>
        <input class="control" type="text" name="obs" id="obs" maxlength="20" placeholder="Opcional" />
      </div>
    </div>

    <div>
      <label>Foto del ticket</label>
      <div class="btn-foto-wrap">
        <button type="button" id="btnCamara">📷 Sacar foto</button>
        <button type="button" id="btnArchivo">🖼️ Galería</button>
      </div>
      <input type="file" id="foto" name="foto" accept="image/*" style="display:none;" />
    </div>

    <img id="fotoPreview" src="" alt="Vista previa del ticket" />
    <div id="fotoInfo"></div>

    <button type="submit" id="btnSubir">⬆️ Subir ticket</button>

    <div id="msg" role="alert" aria-live="polite"></div>

  </form>
</div>

<script>
/* ============================================================
   REFERENCIAS DOM
   ============================================================ */
const msgEl       = document.getElementById('msg');
const spinnerEl   = document.getElementById('spinner');
const spinnerTxt  = document.getElementById('spinner-text');
const fotoInput   = document.getElementById('foto');
const fotoPreview = document.getElementById('fotoPreview');
const fotoInfo    = document.getElementById('fotoInfo');
const fechaInput  = document.getElementById('fecha');
const repartSel   = document.getElementById('repartidor');

/* ============================================================
   SESIÓN — niveles: admin / usuario 1 / usuario 2
   ============================================================ */
let sesion = null;
try { sesion = JSON.parse(sessionStorage.getItem('sad_user')); } catch(e) {}

const NIVEL = (sesion && sesion.nivel ? String(sesion.nivel).toLowerCase().trim() : 'usuario 1');
const ES_ADMIN     = NIVEL === 'admin';
const ES_USUARIO_1 = NIVEL === 'usuario 1' || NIVEL === 'usuario1';
const ES_USUARIO_2 = NIVEL === 'usuario 2' || NIVEL === 'usuario2';

document.getElementById('badgeNombre').textContent = sesion?.nombre || '—';
const nivelTag = document.getElementById('nivelTag');
nivelTag.textContent = NIVEL;
if (ES_ADMIN) nivelTag.classList.add('admin');

function cerrarSesion() {
  if (confirm('¿Cerrar sesión?')) {
    sessionStorage.removeItem('sad_user');
    window.location.replace('login.html');
  }
}

/* ============================================================
   SPINNER / MENSAJES
   ============================================================ */
function showSpinner(t) { spinnerTxt.textContent = t || 'Procesando...'; spinnerEl.classList.add('visible'); }
function hideSpinner() { spinnerEl.classList.remove('visible'); }
function setMsg(text, color) {
  msgEl.textContent = text;
  msgEl.style.color      = color || '#fff';
  msgEl.style.background = color
    ? (color === '#9dffb0' ? 'rgba(34,197,94,.12)' :
       color === '#ffcc00' ? 'rgba(251,191,36,.12)' : 'rgba(239,68,68,.12)')
    : 'transparent';
  msgEl.style.opacity = '1';
}
function clearMsg() {
  msgEl.style.transition = 'opacity .5s';
  msgEl.style.opacity    = '0';
  setTimeout(() => { msgEl.textContent = ''; msgEl.style.background = 'transparent'; }, 520);
}
function showOfflineAlert() {
  const el = document.getElementById('offline-alert');
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 4000);
}

/* ============================================================
   FECHA POR DEFECTO Y BLOQUEO
   ============================================================ */
const HOY = new Date().toISOString().split('T')[0];
fechaInput.value = HOY;

if (!ES_ADMIN) {
  // usuario 1 y usuario 2: fecha bloqueada a hoy
  fechaInput.min = HOY;
  fechaInput.max = HOY;
  fechaInput.readOnly = true;
  fechaInput.classList.add('locked');
  document.getElementById('hintFecha').style.display = 'flex';

  // Forzar reset si alguien intenta cambiarla por DevTools
  fechaInput.addEventListener('change', () => {
    if (fechaInput.value !== HOY) fechaInput.value = HOY;
  });
}

/* ============================================================
   CARGAR LISTAS — llama directamente al proxy (evita cache SW)
   ============================================================ */
const PROXY_URL = "https://sad-proxy.colatino-ventas-enlinea.workers.dev/";
const BACKEND_GET = PROXY_URL + "?url=" + encodeURIComponent(
  "https://script.google.com/macros/s/AKfycbwTwp6Cc35zWr18MeSc9hkE18m0j_Km6S9mOv5kY-2AFrHnFivLLiplQTyQRL9ysg7R/exec"
) + "&t=" + Date.now(); // timestamp anti-cache

let listasCargadas = false;
(async function cargarListas() {
  try {
    const r = await fetch(BACKEND_GET, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();

    if (!data.tiendas || !data.repartidores || !data.franjas) {
      throw new Error('Respuesta incompleta: ' + JSON.stringify(data));
    }

    fillSelect('tienda',     data.tiendas,      'Seleccione tienda...');
    fillSelect('repartidor', data.repartidores, 'Seleccione repartidor...');
    fillSelect('franja',     data.franjas,      'Seleccione franja horaria...');

    listasCargadas = true;

    // Debug: mostrar sesión en consola para verificar tiendaPre
    console.log('[Nexo] sesion:', JSON.stringify(sesion));
    console.log('[Nexo] tiendaPre:', sesion && sesion.tiendaPre);

    aplicarReglasRepartidor();
    aplicarReglasTienda();
    aplicarReglasFranja();
  } catch (err) {
    setMsg('⚠️ Error cargando listas: ' + err.message, '#ffcc00');
    console.error('[Nexo] cargarListas:', err);
  }
})();

function fillSelect(id, arr, placeholder) {
  const el = document.getElementById(id);
  el.innerHTML = '';
  const ph = document.createElement('option');
  ph.value = ''; ph.textContent = placeholder;
  ph.disabled = true; ph.selected = true;
  el.appendChild(ph);
  (arr || []).forEach(v => {
    const op = document.createElement('option');
    op.value = v; op.textContent = v;
    el.appendChild(op);
  });
}

/* ============================================================
   REGLAS PARA REPARTIDOR SEGÚN NIVEL
   - admin     : selector libre
   - usuario 1 : repartidor = nombre login (bloqueado)
   - usuario 2 : selector libre
   ============================================================ */
function aplicarReglasRepartidor() {
  if (!listasCargadas || !sesion) return;

  if (ES_USUARIO_1) {
    const opciones = Array.from(repartSel.options).map(o => o.value);
    const miNombre = sesion.nombre || sesion.usuario;
    const match = opciones.find(o =>
      o.toLowerCase().trim() === miNombre.toLowerCase().trim()
    );
    if (match) {
      repartSel.value = match;
    } else {
      const op = document.createElement('option');
      op.value = miNombre; op.textContent = miNombre; op.selected = true;
      repartSel.appendChild(op);
      repartSel.value = miNombre;
    }
    repartSel.disabled = true;
    repartSel.classList.add('locked');
    document.getElementById('hintRepartidor').style.display = 'flex';
  }
}

/* ============================================================
   TIENDA PREDEFINIDA (columna U = TIENDA_PRE en tabla USUARIOS)
   Todos los niveles pueden cambiarla, pero aparece preseleccionada
   ============================================================ */
function aplicarReglasTienda() {
  const tiendaPre = sesion && sesion.tiendaPre ? sesion.tiendaPre.trim() : '';
  if (!tiendaPre) return;

  const tiendaSel = document.getElementById('tienda');
  const opciones  = Array.from(tiendaSel.options).map(o => o.value);

  // Buscar coincidencia exacta (case-insensitive)
  const match = opciones.find(o =>
    o.toLowerCase().trim() === tiendaPre.toLowerCase()
  );

  if (match) {
    tiendaSel.value = match;
  } else {
    // Si la tienda predefinida no está en la lista (aún no cargada o no existe),
    // añadirla temporalmente
    const op = document.createElement('option');
    op.value = tiendaPre;
    op.textContent = tiendaPre;
    op.selected = true;
    tiendaSel.appendChild(op);
    tiendaSel.value = tiendaPre;
  }
}

/* ============================================================
   FRANJA HORARIA — bloqueada para USUARIO 2 según hora actual
   Reglas:
     09:00-11:00 → solo 10-13H
     11:00-14:30 → solo 12-14H, 13-16H
     15:00-16:30 → solo 16-19H
     16:30-19:00 → solo 17-19H
     18:00-19:30 → solo 17-19H, 19-22H
   Admin y usuario 1: libre
   ============================================================ */
function getFranjasPermitidas() {
  const ahora = new Date();
  const mins  = ahora.getHours() * 60 + ahora.getMinutes();
  const t = (hh, mm) => hh * 60 + mm;

  // Reglas en orden de prioridad — la última que aplique gana
  // (los rangos solapados 18:00-19:30 y 16:30-19:00 se manejan con acumulación)
  let franjas = [];
  if (mins >= t(9,0)   && mins < t(11,0))  franjas = ['10-13H'];
  if (mins >= t(11,0)  && mins < t(14,30)) franjas = ['12-14H','13-16H'];
  if (mins >= t(15,0)  && mins < t(16,30)) franjas = ['16-19H'];
  if (mins >= t(16,30) && mins < t(19,0))  franjas = ['17-19H'];
  if (mins >= t(18,0)  && mins < t(19,30)) franjas = ['17-19H','19-22H'];
  return franjas;
}

function aplicarReglasFranja() {
  if (!ES_USUARIO_2) return;

  const franjaSel  = document.getElementById('franja');
  const permitidas = getFranjasPermitidas();

  // Guardar SIEMPRE las opciones actuales no-vacías como referencia maestra
  // (no usar caché porque el select puede haberse reconstruido)
  const opcionesActuales = Array.from(franjaSel.options)
    .filter(o => o.value !== '')
    .map(o => ({ value: o.value, text: o.textContent }));

  // Si el select aún no tiene opciones (listas no cargadas), salir
  if (opcionesActuales.length === 0) return;

  // Actualizar el maestre con las opciones actuales (para el reset)
  franjaSel._allOptions = opcionesActuales;

  if (permitidas.length === 0) {
    setMsg('⚠️ Fuera del horario de reparto', '#ffcc00');
    return;
  }

  // Reconstruir el select con SOLO las opciones permitidas
  const placeholder = franjaSel.options[0].cloneNode(true);
  franjaSel.innerHTML = '';
  franjaSel.appendChild(placeholder);

  let primeraPermitida = null;
  opcionesActuales.forEach(op => {
    const permitida = permitidas.some(p => p.toLowerCase() === op.value.toLowerCase());
    if (permitida) {
      const el = document.createElement('option');
      el.value = op.value;
      el.textContent = op.text;
      franjaSel.appendChild(el);
      if (!primeraPermitida) primeraPermitida = op.value;
    }
  });

  // Preseleccionar la primera permitida
  if (primeraPermitida) franjaSel.value = primeraPermitida;

  // Bloquear si solo hay una opción posible
  if (permitidas.length === 1) {
    franjaSel.disabled = true;
    franjaSel.classList.add('locked');
  } else {
    franjaSel.disabled = false;
    franjaSel.classList.remove('locked');
  }
}

/* ============================================================
   BOTONES FOTO
   ============================================================ */
document.getElementById('btnCamara').addEventListener('click', () => {
  fotoInput.removeAttribute('capture');
  fotoInput.setAttribute('capture', 'environment');
  fotoInput.click();
});
document.getElementById('btnArchivo').addEventListener('click', () => {
  fotoInput.removeAttribute('capture');
  fotoInput.click();
});

fotoInput.addEventListener('change', async () => {
  const file = fotoInput.files[0];
  if (!file) return;

  const urlOrig = URL.createObjectURL(file);
  fotoPreview.onload = () => URL.revokeObjectURL(urlOrig);
  fotoPreview.src = urlOrig;
  fotoPreview.style.display = 'block';
  const kb = (file.size / 1024).toFixed(0);
  fotoInfo.textContent = `Original: ${kb} KB · Comprimiendo...`;
  fotoInfo.style.display = 'block';

  try {
    const comprimida = await optimizarFoto(file);
    const urlComp = URL.createObjectURL(comprimida);
    fotoPreview.onload = () => URL.revokeObjectURL(urlComp);
    fotoPreview.src = urlComp;
    const kbComp = (comprimida.size / 1024).toFixed(0);
    fotoInfo.textContent = `${kb} KB → ${kbComp} KB ✅`;
    fotoInput._procesada = comprimida;
  } catch(e) {
    fotoInfo.textContent = `${kb} KB (se comprimirá al subir)`;
    fotoInput._procesada = null;
    console.warn('[Nexo] Compresión preview:', e);
  }
});

/* ============================================================
   OPTIMIZACIÓN DE FOTO — EN COLOR, SIN FILTROS
   Solo: corrección EXIF + portrait + compresión JPG calidad 0.82
   ============================================================ */

function getExifOrientation(dataURL) {
  try {
    const b64 = dataURL.split(',')[1];
    const bin = atob(b64);
    const buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    const dv = new DataView(buf.buffer);
    if (dv.getUint16(0) !== 0xFFD8) return 1;
    let offset = 2;
    while (offset < dv.byteLength - 2) {
      const marker = dv.getUint16(offset);
      const len    = dv.getUint16(offset + 2);
      if (marker === 0xFFE1) {
        if (dv.getUint32(offset + 4) === 0x45786966 && dv.getUint16(offset + 8) === 0x0000) {
          const tiff = offset + 10;
          const le   = dv.getUint16(tiff) === 0x4949;
          const ifd  = dv.getUint32(tiff + 4, le);
          const n    = dv.getUint16(tiff + ifd, le);
          for (let i = 0; i < n; i++) {
            const tag = dv.getUint16(tiff + ifd + 2 + i * 12, le);
            if (tag === 0x0112) return dv.getUint16(tiff + ifd + 2 + i * 12 + 8, le);
          }
        }
        return 1;
      }
      if ((marker & 0xFF00) !== 0xFF00) return 1;
      offset += 2 + len;
    }
  } catch(e) {}
  return 1;
}

function optimizarFoto(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('No se pudo leer la imagen'));
    reader.onload = function(ev) {
      const dataURL = ev.target.result;
      const img = new Image();
      img.onerror = () => reject(new Error('Imagen no válida'));
      img.onload = function() {
        try {
          const orientation = getExifOrientation(dataURL);
          const swapExif = [5, 6, 7, 8].includes(orientation);

          // Dimensiones visuales tras EXIF
          let visW = swapExif ? img.naturalHeight : img.naturalWidth;
          let visH = swapExif ? img.naturalWidth  : img.naturalHeight;

          // Forzar portrait
          const needsRot = visW > visH;
          if (needsRot) [visW, visH] = [visH, visW];

          // Escalar: máx 1800px alto, 1200px ancho
          const MAX_H = 1800, MAX_W = 1200;
          const scale = Math.min(MAX_H / visH, MAX_W / visW, 1);
          const dstW  = Math.round(visW * scale);
          const dstH  = Math.round(visH * scale);

          const canvas = document.createElement('canvas');
          canvas.width  = dstW;
          canvas.height = dstH;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#fff';
          ctx.fillRect(0, 0, dstW, dstH);

          // Aplicar transformación EXIF + portrait
          ctx.save();
          const sW = swapExif ? img.naturalHeight : img.naturalWidth;
          const sH = swapExif ? img.naturalWidth  : img.naturalHeight;

          if (!needsRot) {
            const sx = dstW / sW, sy = dstH / sH;
            switch (orientation) {
              case 2: ctx.translate(dstW,0); ctx.scale(-sx,sy); break;
              case 3: ctx.translate(dstW,dstH); ctx.rotate(Math.PI); ctx.scale(sx,sy); break;
              case 4: ctx.translate(0,dstH); ctx.scale(sx,-sy); break;
              case 6: ctx.translate(dstW,0); ctx.rotate(Math.PI/2); ctx.scale(sy,sx); break;
              case 8: ctx.rotate(-Math.PI/2); ctx.translate(-sW*sy,0); ctx.scale(sy,sx); break;
              default: ctx.scale(sx,sy);
            }
          } else {
            // Landscape → portrait: rotar 90° horario
            const sx = dstH / sW, sy = dstW / sH;
            ctx.translate(dstW, 0);
            ctx.rotate(Math.PI / 2);
            ctx.scale(sy, sx);
          }
          ctx.drawImage(img, 0, 0);
          ctx.restore();

          // Exportar en COLOR, JPG calidad 0.82
          canvas.toBlob(blob => {
            if (!blob) return reject(new Error('Error al exportar'));
            resolve(new File([blob], 'ticket.jpg', { type: 'image/jpeg' }));
          }, 'image/jpeg', 0.82);

        } catch(err) { reject(err); }
      };
      img.src = dataURL;
    };
    reader.readAsDataURL(file);
  });
}


/* ============================================================
   ENVÍO DEL TICKET
   ============================================================ */
let _submitting = false;

document.getElementById('ticketForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  if (_submitting) return;

  if (!navigator.onLine) { showOfflineAlert(); return; }

  const foto = fotoInput.files[0];
  if (!foto) { alert('Por favor, selecciona una foto del ticket.'); return; }

  // Forzar fecha de hoy para usuario 1 y usuario 2 (defensa adicional)
  if (!ES_ADMIN) fechaInput.value = HOY;

  // Forzar repartidor para usuario 1 (defensa adicional)
  if (ES_USUARIO_1 && sesion) {
    const miNombre = sesion.nombre || sesion.usuario;
    const opciones = Array.from(repartSel.options).map(o => o.value);
    const match = opciones.find(o => o.toLowerCase().trim() === miNombre.toLowerCase().trim());
    repartSel.value = match || miNombre;
  }

  const campos = ['fecha','tienda','repartidor','franja','pedidos'];
  for (const c of campos) {
    if (!document.getElementById(c).value) {
      alert('Por favor, completa todos los campos obligatorios.');
      return;
    }
  }

  _submitting = true;
  showSpinner('Optimizando foto...');
  setMsg('', '');

  try {
    // Usar versión ya procesada del preview si existe, si no procesar ahora
    let fotoOpt;
    if (fotoInput._procesada) {
      fotoOpt = fotoInput._procesada;
      const kbOpt = (fotoOpt.size / 1024).toFixed(0);
      fotoInfo.textContent = `Escaneada: ${kbOpt} KB ✅`;
    } else {
      try {
        fotoOpt = await optimizarFoto(foto);
        const kbOpt  = (fotoOpt.size / 1024).toFixed(0);
        const kbOrig = (foto.size / 1024).toFixed(0);
        fotoInfo.textContent = `Original: ${kbOrig} KB → Escaneada: ${kbOpt} KB`;
      } catch (optErr) {
        console.warn('[Nexo] Optimización falló, usando original:', optErr);
        fotoOpt = foto;
      }
    }

    spinnerTxt.textContent = 'Subiendo ticket...';

    const base64 = await new Promise((res, rej) => {
      const r = new FileReader();
      r.onload  = () => res(r.result);
      r.onerror = () => rej(new Error('Error leyendo foto optimizada'));
      r.readAsDataURL(fotoOpt);
    });

    const fd = new FormData(document.getElementById('ticketForm'));
    const datos = {};
    fd.forEach((v, k) => { if (k !== 'foto') datos[k] = v; });
    datos.imagenBase64  = base64;
    datos.usuarioSesion = sesion ? sesion.usuario : '';
    datos.nivelSesion   = NIVEL;

    const resp = await fetch(window.BACKEND_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(datos)
    });
    const text = await resp.text();

    if (text.includes('OK')) {
      setMsg('✅ ' + text, '#9dffb0');
    } else if (text.includes('NO_DETECTADO')) {
      setMsg('⚠️ Ticket subido (número no detectado).', '#ffcc00');
    } else {
      setMsg(text, text.includes('ERROR') ? '#fca5a5' : '#9dffb0');
    }

    setTimeout(() => {
      const form = document.getElementById('ticketForm');
      form.reset();

      // Restablecer fecha (a hoy siempre)
      fechaInput.value = HOY;

      // Restablecer tienda predefinida
      aplicarReglasTienda();

      // Restaurar TODAS las opciones de franja antes de aplicar reglas
      // (form.reset() vacía el select, necesitamos las opciones maestras)
      if (ES_USUARIO_2) {
        const franjaSel = document.getElementById('franja');
        const maestras  = franjaSel._allOptions;
        if (maestras && maestras.length > 0) {
          // Reconstruir con todas las franjas
          const ph = franjaSel.options[0] ? franjaSel.options[0].cloneNode(true) : (() => {
            const o = document.createElement('option');
            o.value = ''; o.textContent = 'Seleccione franja horaria...';
            o.disabled = true; o.selected = true;
            return o;
          })();
          franjaSel.innerHTML = '';
          franjaSel.appendChild(ph);
          maestras.forEach(op => {
            const el = document.createElement('option');
            el.value = op.value; el.textContent = op.text;
            franjaSel.appendChild(el);
          });
        }
        aplicarReglasFranja();
      }

      // Repartidor: para usuario 1, restablecer al suyo. Resto, placeholder
      if (ES_USUARIO_1) {
        aplicarReglasRepartidor();
      } else {
        repartSel.selectedIndex = 0;
      }

      fotoPreview.style.display = 'none';
      fotoPreview.src = '';
      fotoInfo.style.display = 'none';
      fotoInput._procesada = null;
      clearMsg();
      _submitting = false;
    }, 5000);

  } catch (err) {
    setMsg('❌ Error: ' + err.message, '#fca5a5');
    console.error('[Nexo] submit:', err);
    _submitting = false;
  } finally {
    hideSpinner();
  }
});

/* ============================================================
   REGISTRAR SERVICE WORKER
   ============================================================ */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(e => {
      console.warn('[Nexo] SW register failed:', e);
    });
  });
}
</script>
