<!DOCTYPE html>
<!-- Nexo Tickets — inicio-embolsado.html
     Página de inicio propia del departamento EMBOLSADO (columna DEPARTAMENTO
     de la hoja USUARIOS): logo y 4 botones grandes — Reservas, Incidencias,
     Embolsado e Informe. Los ADM siguen viendo el index normal.

     v3.10.1 (2026-10-09, ronda 24): diseño nuevo (nexo-tema.css) y
     comprobación de versión al entrar (nexo-version.js + version.json).
     La lógica no cambia: mismos destinos, mismo contador de incidencias. -->
<html lang="es" data-pagina="inicio-embolsado" data-version="v3.10.1">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FEFEFE" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Nexo Tickets" />
<link rel="manifest" href="manifest.json?v=5">
<link rel="icon" href="nexo-icon-192.png">
<link rel="apple-touch-icon" href="nexo-icon-192.png">
<title>Nexo · Embolsado</title>
<link rel="stylesheet" href="nexo-tema.css?v=24">
<script src="nexo-version.js?v=1"></script>
<style>
body.nx { display:flex; flex-direction:column; }
.panel-logo { background:var(--nx-cabecera); box-shadow:0 1px 0 var(--nx-linea);
  padding:calc(36px + env(safe-area-inset-top)) 24px 16px; display:flex; flex-direction:column; align-items:center; gap:10px; }
.panel-logo img { display:block; height:92px; width:auto; max-width:80vw; }
.panel-usuario { display:flex; align-items:center; gap:8px; font-size:14px; font-weight:700; }
.menu { width:100%; max-width:480px; margin:0 auto; padding:24px 16px; display:flex; flex-direction:column; gap:12px; }
.menu a { display:grid; grid-template-columns:64px minmax(0,1fr) 24px; align-items:center; gap:16px; min-height:104px;
  padding:16px; border-radius:var(--nx-r-tarjeta); background:var(--nx-superficie); color:var(--nx-tinta);
  text-decoration:none; transition:transform .12s; }
.menu a:active { transform:scale(.98); }
.menu .ico { position:relative; width:64px; height:64px; border-radius:14px; background:var(--nx-tinta); color:var(--nx-tinta-clara);
  display:grid; place-items:center; }
.menu .txt { font-family:var(--nx-display); font-weight:800; font-size:34px; line-height:1; }
.menu .flecha { color:var(--nx-suave); }
.menu .num { position:absolute; top:-8px; right:-8px; min-width:26px; height:26px; padding:0 6px; border-radius:13px;
  background:var(--nx-rojo); color:#fff; font-size:14px; font-weight:800; display:none; align-items:center; justify-content:center; }
.nx-version { margin-top:auto; }
</style>
<script>
(function sessionGuard() {
  try {
    var raw = sessionStorage.getItem('sad_user');
    if (!raw) { window.location.replace('login.html'); return; }
    var u = JSON.parse(raw);
    if (!u || !u.usuario || !u.token) {
      sessionStorage.removeItem('sad_user');
      window.location.replace('login.html');
      return;
    }
    // Esta página es del departamento EMBOLSADO (y de ADM, para poder verla).
    // Si ya se sabe que el usuario es de otro departamento, vuelve al index normal.
    var nivel = String(u.nivel || '').toLowerCase().trim();
    var depto = (typeof u.departamento === 'undefined') ? null : String(u.departamento || '').toUpperCase().trim();
    if (depto !== null && depto !== 'EMBOLSADO' && nivel !== 'admin') {
      window.location.replace('index.html');
    }
  } catch(e) {
    sessionStorage.removeItem('sad_user');
    window.location.replace('login.html');
  }
})();
</script>
</head>
<body class="nx">

<header class="panel-logo">
  <img src="nexo-logo-oficial.png" alt="Nexo" />
  <div class="panel-usuario" id="userBadge">
    <span id="badgeNombre">—</span>
    <span class="nx-nivel" id="nivelTag">Embolsado</span>
    <button type="button" class="nx-salir" onclick="cerrarSesion()">Salir</button>
  </div>
</header>

<nav class="menu" aria-label="Menú de Embolsado">
  <a id="btnReservas" href="reservas.html">
    <span class="ico"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="6" width="16" height="14" rx="2"/><path d="M4 10h16M8 4v4M16 4v4"/></svg></span>
    <span class="txt">Reservas</span><svg class="flecha" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
  </a>
  <a id="btnIncidencias" href="incidencias.html">
    <span class="ico"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4l9 16H3zM12 10v4M12 17.5v.5"/></svg><span class="num" id="numIncidencias"></span></span>
    <span class="txt">Incidencias</span><svg class="flecha" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
  </a>
  <a id="btnEmbolsado" href="#">
    <span class="ico"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12l1 12H5zM9 8V6a3 3 0 0 1 6 0v2"/></svg></span>
    <span class="txt">Embolsado</span><svg class="flecha" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
  </a>
  <a id="btnInforme" href="informe.html">
    <span class="ico"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg></span>
    <span class="txt">Informe</span><svg class="flecha" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
  </a>
</nav>

<div class="nx-version" data-nexo-version="Nexo · Embolsado">Nexo · Embolsado v3.10.1</div>

<script>
let sesion = null;
try { sesion = JSON.parse(sessionStorage.getItem('sad_user')); } catch(e) {}
const USUARIO = (sesion && sesion.usuario) || '';
const NIVEL   = (sesion && sesion.nivel ? String(sesion.nivel).toLowerCase().trim() : '');

document.getElementById('badgeNombre').textContent = (sesion && sesion.nombre) || '—';
if (NIVEL === 'admin') document.getElementById('nivelTag').textContent = 'ADM';

/* Mismas URL que en index.html / incidencias.html */
var EMBOLSADO_URL = 'https://script.google.com/macros/s/AKfycbxvyzpNQObvloq0tuoDisEn4qrGWh0tEGfGHn4NXoEqP1ShODyIWQ1bzYyWfcuz_Pqh/exec';
var PROXY_BASE    = 'https://sad-proxy.colatino-ventas-enlinea.workers.dev/';

// El usuario ya logueado se pasa a los módulos (?u=usuario) para que entren
// directo, sin volver a pedir contraseña — igual que hace index.html.
document.getElementById('btnReservas').href  = 'reservas.html?u=' + encodeURIComponent(USUARIO);
document.getElementById('btnEmbolsado').href = EMBOLSADO_URL + '?u=' + encodeURIComponent(USUARIO);

function cerrarSesion() {
  if (confirm('¿Cerrar sesión?')) {
    sessionStorage.removeItem('sad_user');
    localStorage.removeItem('sad_user');
    window.location.replace('login.html');
  }
}

/* Globo rojo de Incidencias: nº de incidencias ABIERTAS (Embolsado y ADM las
   ven todas). Misma consulta que index.html; se refresca cada minuto y al
   volver a la página. Sin conexión se deja el último valor. */
(function () {
  if (!USUARIO) return;
  var el = document.getElementById('numIncidencias');
  async function refrescarIncidencias() {
    try {
      var r = await fetch(PROXY_BASE + '?url=' + encodeURIComponent(EMBOLSADO_URL), {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ accion: 'contarIncidenciasAbiertas', usuario: USUARIO })
      });
      var d = JSON.parse(await r.text());
      var n = (d && d.ok) ? (d.total || 0) : 0;
      el.textContent = n > 99 ? '99+' : String(n);
      el.style.display = n > 0 ? 'flex' : 'none';
    } catch (e) { /* sin conexión o respuesta no válida: se deja como estaba */ }
  }
  refrescarIncidencias();
  setInterval(refrescarIncidencias, 60000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) refrescarIncidencias(); });
  window.addEventListener('pageshow', function (ev) { if (ev.persisted) refrescarIncidencias(); });
})();

/* Service worker (el mismo de toda la app) */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js?v=8').catch(function () {});
}
</script>
</body>
</html>
