<!DOCTYPE html>
<!-- Nexo Tickets — inicio-embolsado.html (nuevo, 2026-10-02)
     Página de inicio propia del departamento EMBOLSADO (columna DEPARTAMENTO
     de la hoja USUARIOS). Solo el logo y 4 botones grandes, apilados y
     centrados: Reservas, Incidencias, Embolsado e Informe.

     Cómo se llega aquí: login.html guarda el departamento en la sesión y
     index.html, al cargar, manda a esta página a quien sea de EMBOLSADO
     (los ADM siguen viendo el index normal). Requiere el main.gs de NEXO
     SCRIPT del 2026-10-02, que devuelve el departamento al hacer login.

     Los 4 botones van al mismo sitio que sus equivalentes de index.html:
       Reservas    → reservas.html?u=usuario
       Incidencias → incidencias.html   (globo rojo = incidencias abiertas)
       Embolsado   → Módulo Embolsado (Apps Script) ?u=usuario
       Informe     → informe.html       (columna INFORME de USUARIOS) -->
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#003366" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Nexo Tickets" />
<link rel="manifest" href="manifest.json?v=5">
<link rel="icon" href="nexo-icon-192.png">
<link rel="apple-touch-icon" href="nexo-icon-192.png">
<title>Nexo · Embolsado</title>
<style>
:root {
  --bg1:#003366; --bg2:#0077cc;
  --card-bg:rgba(255,255,255,.12);
  --text-main:#fff; --text-dark:#003366;
  --radius-card:24px;
  --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", sans-serif;
}
*, *::before, *::after { box-sizing:border-box; -webkit-font-smoothing:antialiased; font-family:var(--font); }
html, body { height:100%; }
body {
  margin:0; min-height:100vh; min-height:100dvh;
  background:linear-gradient(180deg, var(--bg1), var(--bg2));
  background-attachment:fixed;
  color:var(--text-main);
  display:flex; justify-content:center; align-items:center;   /* centrado en la página */
  padding:20px 16px;
  padding-top:max(20px, env(safe-area-inset-top));
  padding-bottom:max(20px, env(safe-area-inset-bottom));
}
.card {
  width:100%; max-width:420px;
  background:var(--card-bg);
  border-radius:var(--radius-card);
  box-shadow:0 16px 40px rgba(0,0,0,.45);
  padding:24px 18px 22px;
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  text-align:center;
}
.logo {
  width:190px; max-width:70%;
  height:auto; display:block;
  margin:0 auto 12px auto;
  background:#fff;
  border-radius:16px;
  padding:9px 16px;
}
.user-badge {
  display:inline-flex; align-items:center; gap:6px;
  background:rgba(255,255,255,.15);
  border:1px solid rgba(255,255,255,.2);
  border-radius:20px;
  padding:5px 14px 5px 10px;
  font-size:.8rem; font-weight:700;
  color:rgba(255,255,255,.92);
  cursor:pointer;
  transition:background .18s;
}
.user-badge:hover { background:rgba(255,255,255,.23); }
.nivel-tag {
  display:inline-block;
  background:rgba(96,165,250,.25);
  color:#bfdbfe;
  padding:2px 8px;
  border-radius:10px;
  font-size:.65rem;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.05em;
  margin-left:6px;
}
.nivel-tag.admin { background:rgba(251,146,60,.25); color:#fed7aa; }

/* ===== Botones grandes, apilados y centrados ===== */
.menu {
  display:flex; flex-direction:column; align-items:center;
  gap:14px;
  margin:22px auto 18px;
  width:100%; max-width:330px;
}
.menu a {
  position:relative;
  display:flex; align-items:center; gap:16px;
  width:100%; min-height:88px;
  padding:12px 18px;
  background:#fff; color:var(--text-dark);
  border-radius:20px;
  text-decoration:none;
  font-size:1.22rem; font-weight:800; letter-spacing:.04em; text-transform:uppercase;
  box-shadow:0 10px 26px rgba(0,0,0,.38);
  transition:transform .12s, box-shadow .12s;
  -webkit-tap-highlight-color:transparent;
  user-select:none; -webkit-user-select:none;
}
.menu a:active { transform:scale(.97); box-shadow:0 5px 14px rgba(0,0,0,.38); }
.menu a:focus-visible { outline:3px solid #ffcc00; outline-offset:3px; }
.menu .ico {
  position:relative; flex:0 0 auto;
  width:62px; height:62px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
}
.menu .ico .img { width:100%; height:100%; border-radius:50%; overflow:hidden; display:block; }
.menu .ico img { width:100%; height:100%; display:block; object-fit:cover; }
/* boton_embolsado.png trae margen transparente alrededor del círculo:
   se amplía y se sube un poco para que llene igual que los demás iconos. */
.menu .ico img.ajuste-embolsado { transform:scale(1.41) translate(-.6%, -7%); }
.menu .ico.emoji { background:#fff3cd; font-size:34px; line-height:1; }
.menu .txt { flex:1; text-align:left; line-height:1.15; }
.menu .flecha { flex:0 0 auto; font-size:1.5rem; font-weight:400; color:#94a3b8; }
.menu .num {
  position:absolute; top:-6px; right:-6px;
  min-width:24px; height:24px; padding:0 6px; border-radius:999px;
  background:#dc2626; color:#fff; font-size:13px; font-weight:800; letter-spacing:0;
  display:none; align-items:center; justify-content:center;
  border:2px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,.35);
}
.app-version { font-size:.78rem; font-weight:600; color:rgba(255,255,255,.45); }

/* Pantallas bajas (móviles pequeños o en horizontal): todo un poco más compacto */
@media (max-height:640px) {
  .card { padding:16px 16px 14px; }
  .logo { width:150px; margin-bottom:8px; }
  .menu { gap:10px; margin:14px auto 12px; }
  .menu a { min-height:72px; font-size:1.1rem; padding:8px 16px; }
  .menu .ico { width:52px; height:52px; }
  .menu .ico.emoji { font-size:28px; }
}
</style>

<!-- GUARD DE SESIÓN: redirige antes de pintar nada (igual que index.html) -->
<script>
(function sessionGuard() {
  try {
    var raw = sessionStorage.getItem('sad_user');
    if (!raw) { window.location.replace('login.html'); return; }
    var u = JSON.parse(raw);
    if (!u || !u.usuario || !u.token) {
      sessionStorage.removeItem('sad_user');
      window.location.replace('login.html');
      return;
    }
    // Esta página es del departamento EMBOLSADO (y de ADM, para poder verla).
    // Si ya se sabe que el usuario es de otro departamento, vuelve al index normal.
    var nivel = String(u.nivel || '').toLowerCase().trim();
    var depto = (typeof u.departamento === 'undefined') ? null : String(u.departamento || '').toUpperCase().trim();
    if (depto !== null && depto !== 'EMBOLSADO' && nivel !== 'admin') {
      window.location.replace('index.html');
    }
  } catch(e) {
    sessionStorage.removeItem('sad_user');
    window.location.replace('login.html');
  }
})();
</script>
</head>
<body>

<div class="card">
  <img class="logo" src="nexo-logo-full.png" alt="Nexo · Distribución Inteligente" />
  <div class="user-badge" id="userBadge" onclick="cerrarSesion()" title="Pulsa para cerrar sesión">
    👤 <span id="badgeNombre">—</span>
    <span class="nivel-tag" id="nivelTag">Embolsado</span>
    &nbsp;·&nbsp;Salir
  </div>

  <nav class="menu" aria-label="Menú de Embolsado">
    <a id="btnReservas" href="reservas.html">
      <span class="ico"><span class="img"><img src="boton_reservas.png" alt="" /></span></span>
      <span class="txt">Reservas</span><span class="flecha" aria-hidden="true">›</span>
    </a>
    <a id="btnIncidencias" href="incidencias.html">
      <span class="ico emoji" aria-hidden="true">⚠️<span class="num" id="numIncidencias"></span></span>
      <span class="txt">Incidencias</span><span class="flecha" aria-hidden="true">›</span>
    </a>
    <a id="btnEmbolsado" href="#">
      <span class="ico"><span class="img"><img class="ajuste-embolsado" src="boton_embolsado.png" alt="" /></span></span>
      <span class="txt">Embolsado</span><span class="flecha" aria-hidden="true">›</span>
    </a>
    <a id="btnInforme" href="informe.html">
      <span class="ico"><span class="img"><img src="boton_informe.png" alt="" /></span></span>
      <span class="txt">Informe</span><span class="flecha" aria-hidden="true">›</span>
    </a>
  </nav>

  <div class="app-version">Nexo · Embolsado v1.0.0</div>
</div>

<script>
let sesion = null;
try { sesion = JSON.parse(sessionStorage.getItem('sad_user')); } catch(e) {}
const USUARIO = (sesion && sesion.usuario) || '';
const NIVEL   = (sesion && sesion.nivel ? String(sesion.nivel).toLowerCase().trim() : '');

document.getElementById('badgeNombre').textContent = (sesion && sesion.nombre) || '—';
if (NIVEL === 'admin') {
  const tag = document.getElementById('nivelTag');
  tag.textContent = 'admin';
  tag.classList.add('admin');
}

/* Mismas URL que en index.html / incidencias.html */
var EMBOLSADO_URL = 'https://script.google.com/macros/s/AKfycbxvyzpNQObvloq0tuoDisEn4qrGWh0tEGfGHn4NXoEqP1ShODyIWQ1bzYyWfcuz_Pqh/exec';
var PROXY_BASE    = 'https://sad-proxy.colatino-ventas-enlinea.workers.dev/';

// El usuario ya logueado se pasa a los módulos (?u=usuario) para que entren
// directo, sin volver a pedir contraseña — igual que hace index.html.
document.getElementById('btnReservas').href  = 'reservas.html?u=' + encodeURIComponent(USUARIO);
document.getElementById('btnEmbolsado').href = EMBOLSADO_URL + '?u=' + encodeURIComponent(USUARIO);

function cerrarSesion() {
  if (confirm('¿Cerrar sesión?')) {
    sessionStorage.removeItem('sad_user');
    localStorage.removeItem('sad_user');
    window.location.replace('login.html');
  }
}

/* Globo rojo de Incidencias: nº de incidencias ABIERTAS (Embolsado y ADM las
   ven todas). Misma consulta que index.html; se refresca cada minuto y al
   volver a la página. Sin conexión se deja el último valor. */
(function () {
  if (!USUARIO) return;
  var el = document.getElementById('numIncidencias');
  async function refrescarIncidencias() {
    try {
      var r = await fetch(PROXY_BASE + '?url=' + encodeURIComponent(EMBOLSADO_URL), {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ accion: 'contarIncidenciasAbiertas', usuario: USUARIO })
      });
      var d = JSON.parse(await r.text());
      var n = (d && d.ok) ? (d.total || 0) : 0;
      el.textContent = n > 99 ? '99+' : String(n);
      el.style.display = n > 0 ? 'flex' : 'none';
    } catch (e) { /* sin conexión o respuesta no válida: se deja como estaba */ }
  }
  refrescarIncidencias();
  setInterval(refrescarIncidencias, 60000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) refrescarIncidencias(); });
  window.addEventListener('pageshow', function (ev) { if (ev.persisted) refrescarIncidencias(); });
})();

/* Service worker (el mismo de toda la app) */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js?v=8').catch(function () {});
}
</script>
</body>
</html>
