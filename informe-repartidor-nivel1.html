<style>
/* Layout: una columna de bandas apiladas; cabecera fija con los dos filtros,
   luego KPIs, curva del período, comparativas, desglose y paneles de apoyo.
   Dark-first: el panel de control del reparto se mira de noche y en furgoneta. */
:root{
  color-scheme: dark;
  --plane:#0d1014;        /* fondo de página */
  --surface:#14171c;      /* superficie de tarjeta y de gráfico */
  --surface-2:#1b1f26;    /* superficie elevada / filas */
  --ink:#eef1f5;          /* tinta primaria */
  --ink-2:#a8b1bd;        /* tinta secundaria */
  --ink-3:#7c8694;        /* ejes y etiquetas */
  --grid:#242932;         /* rejilla hairline */
  --axis:#333a45;
  --ring:rgba(255,255,255,.10);
  --brand:#3987e5;        /* azul Nexo */
  --brand-soft:rgba(57,135,229,.14);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --seq-1:#184f95; --seq-2:#256abf; --seq-3:#3987e5; --seq-4:#6da7ec; --seq-5:#9ec5f4;
  --proj:#55606e;         /* trama de proyección */
  --water:#2f7fd6;        /* el acuario del total */
  --font-display:"Barlow Condensed","Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme: light;
    --plane:#f4f5f7; --surface:#fbfbfc; --surface-2:#f1f3f6;
    --ink:#101419; --ink-2:#4e5663; --ink-3:#767f8c;
    --grid:#e4e7ec; --axis:#c6ccd4; --ring:rgba(16,20,25,.12);
    --brand:#2a78d6; --brand-soft:rgba(42,120,214,.10);
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300;
    --seq-1:#9ec5f4; --seq-2:#6da7ec; --seq-3:#3987e5; --seq-4:#256abf; --seq-5:#184f95;
    --proj:#aab2bd; --water:#7fc0f0;
  }
}
:root[data-theme="light"]{
  color-scheme: light;
  --plane:#f4f5f7; --surface:#fbfbfc; --surface-2:#f1f3f6;
  --ink:#101419; --ink-2:#4e5663; --ink-3:#767f8c;
  --grid:#e4e7ec; --axis:#c6ccd4; --ring:rgba(16,20,25,.12);
  --brand:#2a78d6; --brand-soft:rgba(42,120,214,.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300;
  --seq-1:#9ec5f4; --seq-2:#6da7ec; --seq-3:#3987e5; --seq-4:#256abf; --seq-5:#184f95;
  --proj:#aab2bd; --water:#7fc0f0;
}

body{background:var(--plane);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--plane)}

.card{background:var(--surface);border:1px solid var(--ring);border-radius:14px}
.flat{background:transparent;border:0}
.num{font-variant-numeric:tabular-nums}
.disp{font-family:var(--font-display);letter-spacing:.01em}
.eyebrow{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.12em;font-weight:600;color:var(--ink-3);font-size:11px}
h1,h2,h3{text-wrap:balance;margin:0}

/* --- controles --- */
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--ring);border-radius:10px;padding:3px;gap:2px}
.seg button{font:inherit;font-size:12.5px;font-weight:600;color:var(--ink-2);background:transparent;border:0;border-radius:7px;padding:5px 11px;cursor:pointer;transition:background .18s ease,color .18s ease}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff}
select,input[type=range]{font:inherit;accent-color:var(--brand)}
select{background:var(--surface-2);color:var(--ink);border:1px solid var(--ring);border-radius:10px;padding:7px 10px;font-size:13px;font-weight:600;max-width:100%}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}

/* --- tiles --- */
.tile{position:relative;overflow:hidden;transition:transform .22s cubic-bezier(.2,.7,.3,1),border-color .22s ease,box-shadow .22s ease}
.tile:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--brand) 45%,var(--ring));box-shadow:0 10px 28px -16px rgba(0,0,0,.55)}
.tile .bigno{font-family:var(--font-display);font-weight:700;line-height:.92;font-size:clamp(38px,7vw,58px)}
.tile .rail{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand);opacity:.0;transition:opacity .22s ease}
.tile:hover .rail{opacity:.9}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;border:1px solid var(--ring);background:var(--surface-2);color:var(--ink-2)}
.pill.up{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.pill.down{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,transparent)}
.pill.demo{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}

/* barras del desglose */
.drillrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;width:100%;text-align:left;font:inherit;background:transparent;border:0;border-radius:8px;padding:6px 8px;cursor:pointer;color:var(--ink-2);transition:background .16s ease,color .16s ease}
.drillrow:hover{background:var(--surface-2);color:var(--ink)}
.drillrow[aria-pressed="true"]{background:var(--brand-soft);color:var(--ink)}
.drillrow .bar{position:relative;height:6px;border-radius:3px;background:var(--grid);margin-top:5px;overflow:hidden}
.drillrow .bar i{position:absolute;inset:0 auto 0 0;background:var(--brand);border-radius:3px;transition:width .45s cubic-bezier(.2,.7,.3,1)}

table.hm{border-collapse:separate;border-spacing:2px}
table.hm th{font:600 11px/1 var(--font-display);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);padding:2px 4px;white-space:nowrap}
table.hm td{width:26px;height:24px;border-radius:4px;text-align:center;font-size:11px;font-weight:600;color:var(--ink);background:var(--surface-2)}

.enter{animation:rise .55s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.recharts-text{font-family:var(--font-body)}
.recharts-surface{overflow:visible}
@media (prefers-reduced-motion:reduce){
  .enter{animation:none}
  .tile:hover{transform:none}
  .water .drift{animation:none}
  *{transition-duration:.01ms!important}
}
.scrollx{overflow-x:auto}

/* el acuario del cuadro Total: el agua sube con la proyección y ondea */
.water{position:absolute;inset:0;pointer-events:none;color:var(--water)}
.water svg{width:100%;height:100%;display:block}
.water .lvl{transform-box:view-box;transform-origin:0 0;transition:transform 1.5s cubic-bezier(.2,.7,.3,1)}
.water .drift{transform-box:view-box;transform-origin:0 0;animation:drift 9s linear infinite;
  transition:animation-duration .3s ease}
.water .drift.b{animation-duration:6.2s;animation-direction:reverse}
.tile:hover .water .drift{animation-duration:3.2s}
.tile:hover .water .drift.b{animation-duration:2.3s}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-200px)}}
.tilebody{position:relative;z-index:1}

/* filas y chips que filtran */
.filtro{font:inherit;background:transparent;border:0;padding:0;text-align:left;width:100%;cursor:pointer;
  border-radius:8px;transition:background .16s ease}
.filtro:hover{background:var(--surface-2)}
.filtro[aria-pressed="true"]{background:var(--brand-soft)}
.chipf{cursor:pointer;font:inherit;transition:border-color .16s ease,background .16s ease}
.chipf[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.hm td.sel{outline:2px solid var(--brand);outline-offset:-2px}
.hm th.fr{cursor:pointer;border-radius:4px}
.hm th.fr:hover{color:var(--ink)}
.hm th.fr[aria-pressed="true"]{color:var(--brand)}
.hm td.on{cursor:pointer}
.navbtn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;
  font:inherit;font-size:15px;font-weight:700;border:1px solid var(--ring);border-radius:12px;padding:14px 12px;
  background:var(--surface-2);color:var(--ink);cursor:pointer;transition:transform .12s ease,background .18s ease}
.navbtn:hover{background:var(--surface)}
.navbtn:active{transform:scale(.98)}
.navbtn.salir{background:rgba(208,59,59,.14);color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,transparent)}
</style>

</head>

const toDate = iso => {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(Date.UTC(y, m - 1, d));
};
const addDays = (iso, n) => {
  const d = toDate(iso);
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
};
const diffDays = (a, b) => Math.round((toDate(b) - toDate(a)) / 86400000);
const dow = iso => toDate(iso).getUTCDay();
const fmtDay = iso => {
  const d = toDate(iso);
  return d.getUTCDate() + " " + MON[d.getUTCMonth()];
};
const fmtShort = iso => {
  const d = toDate(iso);
  return d.getUTCDate() + "/" + (d.getUTCMonth() + 1);
};
const nf = n => new Intl.NumberFormat("es-ES").format(Math.round(n));
const pct = (n, dec = 1) => (n > 0 ? "+" : "") + n.toFixed(dec).replace(".", ",") + "%";
const median = a => {
  if (!a.length) return 0;
  const s = [...a].sort((x, y) => x - y);
  const m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
};

/* días de un período, ambos extremos incluidos */
function daysOf(p) {
  const out = [];
  for (let i = 0; i <= diffDays(p.ini, p.fin); i++) out.push(addDays(p.ini, i));
  return out;
}

/* lee los colores del tema para pasarlos a Recharts (necesita strings, no var()) */
const TOKENS = ["ink", "ink-2", "ink-3", "grid", "axis", "surface", "surface-2", "brand", "proj", "s1", "s2", "s3", "s4", "s5", "s6", "good", "warn", "serious", "crit", "seq-1", "seq-2", "seq-3", "seq-4", "seq-5"];
function useTokens() {
  const read = () => {
    const cs = getComputedStyle(document.documentElement);
    const o = {};
    TOKENS.forEach(t => o[t] = cs.getPropertyValue("--" + t).trim());
    return o;
  };
  const [t, setT] = useState(read);
  useEffect(() => {
    const upd = () => setT(read());
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    mq.addEventListener("change", upd);
    const mo = new MutationObserver(upd);
    mo.observe(document.documentElement, {
      attributes: true,
      attributeFilter: ["data-theme", "style", "class"]
    });
    const id = setTimeout(upd, 60); // por si las fuentes/CSS llegan tarde
    return () => {
      mq.removeEventListener("change", upd);
      mo.disconnect();
      clearTimeout(id);
    };
  }, []);
  return t;
}

/* número animado */
function useCountUp(value, ms = 750) {
  const [v, setV] = useState(value);
  const from = useRef(value);
  useEffect(() => {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      setV(value);
      from.current = value;
      return;
    }
    const a = from.current,
      b = value,
      t0 = performance.now();
    let raf;
    const tick = t => {
      const k = Math.min(1, (t - t0) / ms);
      const e = 1 - Math.pow(1 - k, 3);
      setV(a + (b - a) * e);
      if (k < 1) raf = requestAnimationFrame(tick);else from.current = b;
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [value, ms]);
  return v;
}

/* ------------------------------------------------------------------ agregado */
/* filas: [fecha, tiendaIdx, repIdx, franjaIdx, p, xp, xr] */
function aggregate(periodo, rep) {
  const {
    ini,
    fin
  } = periodo;
  const byDay = new Map(),
    byTienda = new Map(),
    nest = new Map(),
    byFranja = new Map();
  let p = 0,
    xp = 0,
    xr = 0;
  for (const r of DATA.rows) {
    const [f, ti, ri, fri, rp, rxp, rxr] = r;
    if (f < ini || f > fin) continue;
    if (rep !== "*" && DATA.reps[ri] !== rep) continue;
    const tot = rp + rxp + rxr;
    p += rp;
    xp += rxp;
    xr += rxr;
    byDay.set(f, (byDay.get(f) || 0) + tot);
    const tn = DATA.tiendas[ti];
    byTienda.set(tn, (byTienda.get(tn) || 0) + tot);
    const fn = DATA.franjas[fri];
    byFranja.set(fn, (byFranja.get(fn) || 0) + tot);
    if (!nest.has(f)) nest.set(f, new Map());
    const nd = nest.get(f);
    if (!nd.has(tn)) nd.set(tn, new Map());
    nd.get(tn).set(fn, (nd.get(tn).get(fn) || 0) + tot);
  }
  return {
    p,
    xp,
    xr,
    total: p + xp + xr,
    byDay,
    byTienda,
    byFranja,
    nest
  };
}

/* acumulado por día-de-período, hasta n días */
function cumulative(byDay, ini, n) {
  const out = [];
  let acc = 0;
  for (let i = 0; i < n; i++) {
    const f = addDays(ini, i);
    acc += byDay.get(f) || 0;
    out.push({
      d: i + 1,
      fecha: f,
      acc,
      dia: byDay.get(f) || 0
    });
  }
  return out;
}

/* proyección: mediana por día de la semana (período actual + anterior) y un día Club */
function project(agg, prevAgg, prevPeriodo, periodo, elapsed, clubDate, clubUp) {
  const all = daysOf(periodo);
  const pool = {};
