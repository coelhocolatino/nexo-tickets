<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nexo · Configuración</title><link rel="icon" href="nexo-icon-192.png">
<style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(180deg,#003366,#0077cc);color:#fff;font-family:system-ui,sans-serif;text-align:center;padding:24px}
img{width:64px}a{color:#ffcc00;font-weight:700}
@keyframes spin{to{transform:rotate(360deg)}}.ring{width:40px;height:40px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}</style></head>
<body><img src="boton_config.png" alt=""><h2>Configuración</h2>
<div class="ring"></div><p>Abriendo el módulo de Configuración…</p>
<a id="linkManual" href="index.html">← Volver</a>
<script>
// Solo admin. El módulo Config vive dentro de NEXO RESERVAS (Apps Script): se abre con ?p=config.
var RESERVAS_EXEC_URL = "https://script.google.com/macros/s/AKfycbwXkz9LoSa2ucdz9x1_wD9Z0BMsRe9R2vrnZ_MZEeKGSpKN55EQM3cVQLYtdeOL9JwP/exec";
try {
  var u = JSON.parse(sessionStorage.getItem('sad_user') || 'null');
  if (!u || String(u.nivel).toLowerCase() !== 'admin') { location.replace('index.html'); }
  else {
    var usuario = new URLSearchParams(location.search).get('u') || u.usuario || '';
    var url = RESERVAS_EXEC_URL + '?p=config' + (usuario ? '&u=' + encodeURIComponent(usuario) : '');
    document.getElementById('linkManual').textContent = 'Si no abre solo, toca aquí';
    document.getElementById('linkManual').href = url;
    location.replace(url);
  }
} catch (e) { location.replace('login.html'); }
</script>
</body></html>
